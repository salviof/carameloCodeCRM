
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="titulo" />
        <cc:attribute name="icone" default="fa-newspaper-o" />
        <cc:attribute name="codigoestilo"  default="1" />
        <!-- Se não informada, é calculada pelo valor:
             1 a 3 = intensidade 1 | 4 a 6 = intensidade 2 | acima de 6 = intensidade 3 -->
        <cc:attribute name="intensidade" default="#{cc.attrs.valor gt 6 ? '3' : (cc.attrs.valor gt 3 ? '2' : '1')}" />
        <cc:attribute name="valor" default="0" />
        <cc:attribute name="texto" default="-" />
        <cc:attribute name="url"  default="#"
                      />
        <!-- Quando true e o card estiver zerado (cinza), exibe um "+"
             discreto na borda direita, sinalizando que o clique leva a
             um novo registro. O destino continua sendo a mesma url do
             componente. -->
        <cc:attribute name="exibirBotaoNovoCasoZero" default="false" />

    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>


        <h:outputStylesheet  name="dashboard.css" library="dashboard" />

        <p:link href="#{cc.attrs.url}"
                styleClass="card-link"
                onclick="bloquearArea(this.parentElement.id)"
                >
                    <!--                <div class="ui-g card colorbox colorbox-#{cc.attrs.codigoestilo}">-->
            <!-- Sem largura inline: o card ocupa 100% do container onde
                 for inserido (regra .card-moderno em dashboard.css), de
                 modo que varios componentes lado a lado fiquem do mesmo
                 tamanho, independente do tamanho do texto. -->
            <div class="card-moderno card-estilo-#{cc.attrs.codigoestilo}-#{cc.attrs.intensidade} #{(empty cc.attrs.valor or cc.attrs.valor le 0) ? 'card-zerado' : ''} #{(cc.attrs.exibirBotaoNovoCasoZero and (empty cc.attrs.valor or cc.attrs.valor le 0)) ? 'card-com-novo' : ''}"
                 pt:data-card-titulo="#{cc.attrs.titulo}"
                 pt:data-card-valor="#{empty cc.attrs.valor ? 0 : cc.attrs.valor}"
                 xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

                <!-- Selo "+": só no card cinza, e só quando o componente
                     for marcado como atalho para novo registro -->
                <ui:fragment rendered="#{cc.attrs.exibirBotaoNovoCasoZero and (empty cc.attrs.valor or cc.attrs.valor le 0)}">
                    <span class="card-novo-badge" title="Clique para criar um novo registro">
                        <i class="fa fa-plus"></i>
                    </span>
                </ui:fragment>

                <div class="card-conteudo">

                    <h:panelGroup styleClass="card-icone card-estilo-#{cc.attrs.codigoestilo}-#{cc.attrs.intensidade}" style="min-width: 90px;min-height: 90px;">
                        <i class="fa #{cc.attrs.icone}  #{sessaoAtualSBWP.telaUsuario.umMobile?'Fs40':'Fs50'}"  ></i>
                    </h:panelGroup>

                    <div class="card-info">

                        <span class="card-valor #{sessaoAtualSBWP.telaUsuario.umMobile?'Fs24':'Fs30'}"   >#{cc.attrs.texto}</span>
                        <span class="card-titulo #{sessaoAtualSBWP.telaUsuario.umMobile?'Fs16':'Fs24'}" style="margin-left: 3px;">#{cc.attrs.titulo}</span>
                    </div>
                </div>
            </div>
        </p:link>

    </cc:implementation>
</ui:composition>
