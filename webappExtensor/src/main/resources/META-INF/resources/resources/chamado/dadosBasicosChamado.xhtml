<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:pe="http://primefaces.org/ui/extensions"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="chamado"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.chamado.ChamadoCliente" required="true"/>

    </cc:interface>
    <cc:implementation>
        <h:outputStylesheet name="chamado.css" library="chamado"/>

        <h:panelGroup layout="block" styleClass="ChamadoCabecalhoDadosBasicos Container12">
            <h:panelGroup layout="block" styleClass="ChamadoCabecalhoCard">

                <!-- Linha superior: identificação | situação | ações -->
                <h:panelGroup layout="block" styleClass="ChamadoCabecalhoTopo">

                    <h:panelGroup layout="block" styleClass="ChamadoCabecalhoIdentificacao">

                        <h:panelGroup layout="block" styleClass="ChamadoCabecalhoCliente"
                                      rendered="#{servicosCRM.umUsuarioAtendimentoLogado}">
                            <p:link styleClass="ChamadoCabecalhoClienteLink"
                                    href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmOpcoesDoProspecto,cc.attrs.chamado.usuarioCliente.representanteLegal)}">
                                <img class="ChamadoCabecalhoClienteImagem"
                                     alt="#{cc.attrs.chamado.usuarioCliente.representanteLegal.nome}"
                                     src="#{cc.attrs.chamado.usuarioCliente.representanteLegal.imgPequena}"/>
                            </p:link>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="ChamadoCabecalhoTitulos">
                            <h:panelGroup layout="block" styleClass="ChamadoCabecalhoTipo FontPadraoBold">
                                <i class="fa fa-life-ring ChamadoCabecalhoTipoIcone"></i>
                                <span class="ChamadoCabecalhoTipoNome">#{cc.attrs.chamado.tipoChamado.nome}</span>
                            </h:panelGroup>
                            <h:panelGroup layout="block" styleClass="ChamadoCabecalhoData">
                                <i class="fa fa-clock-o ChamadoCabecalhoDataIcone"></i>
                                <span>#{pgUtil.gerarDataHoraTexto(cc.attrs.chamado.dataHoraCriacao)}</span>
                            </h:panelGroup>
                        </h:panelGroup>

                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="ChamadoCabecalhoSituacao">
                        <span class="ChamadoCabecalhoStatus FontPadraoBold">
                            <h:panelGroup rendered="#{not empty cc.attrs.chamado.status.icone}">
                                <i class="#{cc.attrs.chamado.status.icone} ChamadoCabecalhoStatusIcone"></i>
                            </h:panelGroup>
                            <h:outputText value="#{cc.attrs.chamado.status.nome}"/>
                        </span>
                        <span class="ChamadoCabecalhoNumero">nº #{cc.attrs.chamado.id}</span>
                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="ChamadoCabecalhoAcoes">
                        <h:form styleClass="ChamadoCabecalhoAcoesForm">
                            <p:commandButton styleClass="ChamadoCabecalhoBotao"
                                             icon="fa fa-bullhorn"
                                             title="Notificar o cliente"
                                             actionListener="#{servicoChamado.notificar(cc.attrs.chamado)}"/>
                            <p:commandButton styleClass="ChamadoCabecalhoBotao"
                                             icon="fa fa-paperclip"
                                             title="Anexos do chamado"
                                             disabled="true"
                                             actionListener="#{servicoChamado.abrirEFechar(cc.attrs.chamado)}"/>
                            <p:commandButton styleClass="ChamadoCabecalhoBotao ChamadoCabecalhoBotaoPrincipal"
                                             icon="fa fa-times"
                                             value="Fechar Chamado"
                                             rendered="#{!cc.attrs.chamado.foiFinalizado}"
                                             actionListener="#{servicoChamado.abrirEFechar(cc.attrs.chamado)}"/>
                            <p:commandButton styleClass="ChamadoCabecalhoBotao ChamadoCabecalhoBotaoPrincipal"
                                             icon="fa fa-folder-open-o"
                                             value="Abrir Chamado"
                                             rendered="#{cc.attrs.chamado.foiFinalizado}"
                                             actionListener="#{servicoChamado.abrirEFechar(cc.attrs.chamado)}"/>
                        </h:form>
                    </h:panelGroup>

                </h:panelGroup>

                <!-- Descrição / resumo do chamado -->
                <h:panelGroup layout="block" styleClass="ChamadoCabecalhoDescricao">
                    <h:form styleClass="ChamadoCabecalhoDescricaoForm">
                        <p:textEditor value="#{cc.attrs.chamado.descricao}"
                                      readonly="true"
                                      secure="false"
                                      toolbarVisible="false"
                                      styleClass="ResumoChamado editor-branco FontPadraoLight"/>
                    </h:form>
                </h:panelGroup>

            </h:panelGroup>
        </h:panelGroup>
    </cc:implementation>
</ui:composition>
