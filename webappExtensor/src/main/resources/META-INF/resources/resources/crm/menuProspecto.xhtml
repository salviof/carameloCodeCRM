<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:crm="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:crmPessoa="http://xmlns.jcp.org/jsf/composite/crmPessoa"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="pessoaJuridica"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa"
                      required="true"/>

        <cc:attribute name="acoes" type="java.util.List" />
        <cc:attribute name="indice"  default="-1" />
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>



        <h:form rendered="#{cc.attrs.pessoaJuridica!=null}">

            <h:outputStylesheet  name="menuProspecto.css" library="crm"  />



            <h:panelGroup layout="block"  styleClass="botaoLateralMenuPessoaJuridica" style="border-radius: 30px;">
                <p:commandLink  type="button" onclick="PF('sidebar2').show();" styleClass="p-mr-2" >
                    <h:panelGroup layout="span" rendered="#{!cc.attrs.pessoaJuridica.temImagemPequenaAdicionada}"
                                  styleClass="Fs16" style="color:#ffffff; " >
                        #{cc.attrs.pessoaJuridica.nomeCurto}
                        <p:avatar label="#{cc.attrs.pessoaJuridica.nome}" styleClass="p-ml-2"   style="background-color:#4caf4f; color: #ffffff"
                                  rendered="#{!cc.attrs.pessoaJuridica.temImagemPequenaAdicionada}"
                                  />
                    </h:panelGroup>




                    <p:avatar styleClass="p-ml-3" dynamicColor="true" size="xlarge"
                              label=""
                              style="background-color: #ffffff00;"
                              shape="square"
                              rendered="#{cc.attrs.pessoaJuridica.temImagemPequenaAdicionada}">
                        <span class="Fs16" style="color:#ffffff;"> #{cc.attrs.pessoaJuridica.nomeCurto} </span>
                        <p:graphicImage  style="margin-bottom: 30px;height: auto;"  url="#{cc.attrs.pessoaJuridica.imgPequena}"  />
                    </p:avatar>
                </p:commandLink>

            </h:panelGroup>
        </h:form>

        <p:sidebar widgetVar="sidebar2" dynamic="false"
                   position="#{sessaoAtualSBWP.telaUsuario.umMobile?'top':'right'}"
                   rendered="#{cc.attrs.pessoaJuridica!=null}"
                   styleClass="sidebarProspecto"
                   showCloseIcon="true" style="background-color: #ffffff; width: 300px;" baseZIndex="999999999">
            <p:link href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmOpcoesDoProspecto,cc.attrs.pessoaJuridica)}"
                    styleClass="cabecalhoProspecto" title="#{cc.attrs.pessoaJuridica.nome}" >

                <span class="cabecalhoProspectoLogo">
                    <p:avatar label="#{cc.attrs.pessoaJuridica.nomeCurto}" styleClass="cabecalhoProspectoAvatar"
                              shape="circle" size="large"
                              rendered="#{!cc.attrs.pessoaJuridica.temImagemPequenaAdicionada}"
                              />

                    <ui:fragment rendered="#{cc.attrs.pessoaJuridica.temImagemPequenaAdicionada}">
                        <img class="cabecalhoProspectoImagem" alt="#{cc.attrs.pessoaJuridica.nome}"
                             src="#{sessaoAtualSBWP.urlHostDaSessao}/proxyImagem/#{cc.attrs.pessoaJuridica.imgPequena}" />
                    </ui:fragment>
                </span>

                <h3 class="cabecalhoProspectoNome">
                    #{cc.attrs.pessoaJuridica.nome}
                </h3>
            </p:link>

             <p:fieldset styleClass="fieldsetAcoesProspecto" >

                <div class="gradeAcoesProspecto">
                    <a href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmOpcoesDoProspecto,cc.attrs.pessoaJuridica)}" class="botaoAcaoProspecto botaoAcaoProspectoDetalhes" role="button" title="Detalhes" >
                        <i class="fa fa-id-card-o botaoAcaoProspectoIcone"></i>
                        <span class="botaoAcaoProspectoTexto">Detalhes</span>
                    </a>
                    <a href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmChatCliente,cc.attrs.pessoaJuridica)}" class="botaoAcaoProspecto botaoAcaoProspectoChat" role="button" title="Chat" >
                        <i class="fa fa-comments botaoAcaoProspectoIcone"></i>
                        <span class="botaoAcaoProspectoTexto">Chat</span>
                    </a>
                    <a href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmArquivos,cc.attrs.pessoaJuridica)}" class="botaoAcaoProspecto botaoAcaoProspectoArquivos" role="button" title="Arquivos" >
                        <i class="fa fa-files-o botaoAcaoProspectoIcone"></i>
                        <span class="botaoAcaoProspectoTexto">Arquivos</span>
                    </a>
                    <a href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_MeusOrcamentosMbGestao.meusOrcamentosFrmListarOrcamentosDaPessoa,cc.attrs.pessoaJuridica)}" class="botaoAcaoProspecto botaoAcaoProspectoOrcamentos" role="button" title="Orçamentos" >
                        <i class="fa fa-money botaoAcaoProspectoIcone"></i>
                        <span class="botaoAcaoProspectoTexto">Orçamentos</span>
                    </a>
                </div>

            <crmPessoa:acaoRapidaProspectoMin pessoa="#{cc.attrs.pessoaJuridica}" />
            </p:fieldset>
            <p:tabView styleClass="abasProspecto" >
            <p:tab title="Arquivo" >
                <crmPessoa:menuPessoaAcoesDisponiveis pessoa="#{cc.attrs.pessoaJuridica}" />
            </p:tab>
            <p:tab title="Atividades" >
                <h:form styleClass="conteudoAbaProspecto" rendered="#{!cc.attrs.pessoaJuridica.getCampoInstanciadoByNomeOuAnotacao('possuiAtividadesEmAndamento').valor}" >
                <h:panelGroup layout="block" styleClass="conteudoAbaProspecto" >
                    <p:selectOneListbox id="selecaoAtividadePessoa" value="#{servicosCRM.tipoAtividadeSelecionada}" converter="conversorGenerico"
                                        var="atividade" filter="true" filterMatchMode="contains"
                                        styleClass="listaSelecaoProspecto"


                                        >
                        <f:selectItems value="#{cc.attrs.pessoaJuridica.atividadesDisponiveis}" var="atividade" itemLabel="#{atividade.nome}" itemValue="#{atividade}"/>

                        <p:column width="30px" >
                            <i class="#{atividade.iconeAcao}" style="color:##{atividade.cor}}" />
                        </p:column>
                        <p:column>
                            <h:outputText value="#{atividade.nome}"/>
                        </p:column>
                        <p:ajax event="change" listener="#{servicosCRM.iniciarAtividadeInicial(cc.attrs.pessoaJuridica)}"
                                onstart="PF('sidebar2').hide();"
                                />

                    </p:selectOneListbox>
                   </h:panelGroup>
                </h:form>

                <h:panelGroup styleClass="Container12 " rendered="#{cc.attrs.pessoaJuridica.getCampoInstanciadoByNomeOuAnotacao('possuiAtividadesEmAndamento').valor}">

                <crm:botaoEditarAtividade  atividade="#{cc.attrs.pessoaJuridica.getCampoInstanciadoByNomeOuAnotacao('ultimaAtividadeEmAndamento').valor}"/>
            </h:panelGroup>
            </p:tab>

            </p:tabView>

            
            <p:blockUI block="@parent"
                       widgetVar="empresablkcmd#{cc.attrs.pessoaJuridica.id}"
                       >
                <i class=" fa fa-spinner fa-spin fa-5x fa-fw"></i>
            </p:blockUI>
        </p:sidebar>
    </cc:implementation>
</ui:composition>
