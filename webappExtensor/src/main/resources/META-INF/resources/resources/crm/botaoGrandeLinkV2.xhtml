<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"

    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="processar" default="@form" />
        <cc:attribute name="atualizar" default="@form" />
        <cc:attribute name="acao"  type="com.super_bits.modulosSB.SBCore.modulos.Controller.Interfaces.acoes.ComoAcaoDoSistema"/>
        <cc:attribute name="metodo"  method-signature="void listener()"  default="#{paginaAtual.infoPagina.executarAcaoSelecionada()}"/>
        <cc:attribute name="listener"  method-signature="void listener()"  default="#{paginaAtual.infoPagina.executarAcaoSelecionada()}"/>
        <cc:attribute name="cor" default="#0091EA" />
        <cc:attribute name="estilo" shortDescription="Exemplo: botaoGrandeDestaque" />
        <cc:attribute name="label"  default="#{cc.attrs.acao.nomeAcao}" />
        <cc:attribute name="icone" default="#{cc.attrs.acao.icone}" />
        <cc:attribute name="url"  />
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet  name="botaoGrande.css" library="crm" />
        <p:link
            styleClass="btn-card-link"
            href="#{cc.attrs.url}"
            >

            <h:panelGroup layout="block"
                          styleClass="btn-card #{cc.attrs.estilo}"
                          style="--btn-card-cor: #{cc.attrs.cor};">

                <h:panelGroup layout="block" styleClass="btn-card-icon">
                    <i class="#{cc.attrs.icone} fa iconeBotaoQuadrado" aria-hidden="true"></i>
                </h:panelGroup>

                <h:panelGroup layout="block"
                              styleClass="btn-card-text"
                              rendered="#{!pgUtil.isNuloOuEmbranco(cc.attrs.label)}" >
                    <span class="btn-card-title FontAdamantiumRegular TexAlCenter">#{cc.attrs.label}</span>
                </h:panelGroup>

            </h:panelGroup>

            <p:tooltip rendered="#{cc.attrs.acao.descricao!=null}"
                       value="#{cc.attrs.acao.descricao}" />



        </p:link>

    </cc:implementation>
</ui:composition>
