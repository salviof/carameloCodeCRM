
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:pe="http://primefaces.org/ui/extensions"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="usuario"
                      type="com.super_bits.modulosSB.SBCore.modulos.objetos.entidade.basico.ComoUsuario" required="true"/>
        <cc:attribute name="somenteLeitura"
                      type="java.lang.Boolean" required="true"/>
        <cc:attribute name="largura" default="50"/> >
        <cc:attribute name="altura" default="30" />
        <cc:attribute name="mostrarNome"
                      type="java.lang.Boolean"
                      default="false" />
        <cc:attribute name="classeEstilo"  default=" "/>
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <div class="#{cc.attrs.classeEstilo}"
             title="#{!cc.attrs.mostrarNome and cc.attrs.usuario != null ? cc.attrs.usuario.nome : ''}"
             style="display:flex; align-items:center; gap:8px; position:relative;">

            <!-- FOTO REAL -->
            <h:panelGroup rendered="#{cc.attrs.usuario != null and cc.attrs.usuario.temImagemPequenaAdicionada}"
                          layout="block"
                          style="background-image:url('#{sessaoAtualSBWP.urlHostDaSessao}/proxyImagem/#{cc.attrs.usuario.imgPequena}');
                          display:inline-block;
                          width:#{cc.attrs.altura}px;
                          height:#{cc.attrs.altura}px;
                          background-size:cover;
                          background-position:top center;
                          border-radius:50%;
                          flex-shrink:0;">
            </h:panelGroup>

            <!-- GRAVATAR -->
            <p:avatar gravatar="#{cc.attrs.usuario.email}"
                      shape="circle"
                      gravatarConfig="d=monsterid"
                      size="xlarge"
                      rendered="#{cc.attrs.usuario != null and !cc.attrs.usuario.temImagemPequenaAdicionada}"
                      style="width:#{cc.attrs.altura}px;
                      height:#{cc.attrs.altura}px;
                      flex-shrink:0;" />

            <!-- NOME -->
            <p:outputLabel value="#{cc.attrs.usuario.nome}"
                           rendered="#{cc.attrs.mostrarNome and cc.attrs.usuario != null}"
                           style="
                           font-weight:600;
                           font-size:13px;
                           color:#2c3e50;
                           letter-spacing:0.2px;
                           line-height:1;
                           " />

        </div>
    </cc:implementation>
</ui:composition>
