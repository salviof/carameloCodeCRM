<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:crmAtividade="http://xmlns.jcp.org/jsf/composite/crmAtividade"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"

    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:f="http://xmlns.jcp.org/jsf/core">


    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="empresa"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa" required="true"/>

        <cc:attribute name="tamanho" type="java.lang.String" required="false" default="M"
                      shortDescription="Tamanho do botao quadrado da atividade: P, M (padrao) ou G."/>

        <cc:attribute name= "tipoAtividade" type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.Atividade.tipoAtividade.TipoAtividadeCRM" />

    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <h:outputStylesheet name="atividade.css" library="crmAtividade" />


        <h:panelGroup  styleClass="botaoAtvDisponivelPessoa semBorda Container12 OrganizadorContainer" rendered="#{not empty cc.attrs.tipoAtividade.relacionamentoGerado}" >



            <h:panelGroup layout="block" styleClass="Container12" >


                <h:panelGroup styleClass="SbBotoesDeEscolha" layout="block"  rendered="#{cc.attrs.tipoAtividade.relacionamentoGerado.getCampoInstanciadoByNomeOuAnotacao('atividadesExecutivas').valor.size()>0}" >
                    <h:panelGroup layout="block" styleClass="SbAtvQuadLista"  >
                        <ui:repeat value="#{cc.attrs.tipoAtividade.relacionamentoGerado.atividadesExecutivas}" var="atividade" varStatus="rec">
                            <crmAtividade:btAtividadeExecutivaDupla empresa="#{cc.attrs.empresa}" tipoAtividadeExecucao="#{atividade}" tipoAtividadeOrigem="#{cc.attrs.tipoAtividade}" tamanho="#{cc.attrs.tamanho}" />
                        </ui:repeat>
                    </h:panelGroup>
                </h:panelGroup>

            </h:panelGroup>


        </h:panelGroup>


    </cc:implementation>
</ui:composition>
