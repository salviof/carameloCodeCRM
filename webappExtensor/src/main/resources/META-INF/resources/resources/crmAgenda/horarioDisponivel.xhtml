<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:crm="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
    <!-- INTERFACE -->


    <cc:interface>
        <cc:attribute name="horarioDisponivel"
                      type="br.org.carameloCode.erp.modulo.agenda.entidadesJPA.disponibilidade.HorarioDisponivelAtendimentoPublico"
                      required="true"/>
        <cc:attribute name="acao"
                      type="com.super_bits.modulosSB.SBCore.modulos.Controller.Interfaces.acoes.ComoAcaoDoSistema"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet name="agenda.css" library="crmAgenda"/>


        <h:panelGroup layout="block"
                      styleClass="HorarioDisponivel horario-card">



            <h:form style="width: 100%; height: 100%;">

                <!--                            <p:commandLink-->
                <!--&lt;!&ndash;                                styleClass="horario-content"&ndash;&gt;-->
                <!--&lt;!&ndash;                                onstart="PF('loadingDialog').show();"&ndash;&gt;-->
                <!--                                >-->


                <h:panelGroup layout="block" style="text-align: center;" styleClass="horario-content">
                    <div class="horario-icon">
                        <span class="pi pi-clock"></span>
                    </div>

                    <div class="horario-time">
                        #{pgUtil.gerarHoraTextoSimples(horario.dataHoraIicialAtendente)}
                    </div>
                    <div class="horario-text">
                        Reservar Horário
                    </div>
                </h:panelGroup>

                <crm:botaoGrandeV2
                    acao="#{cc.attrs.acao}"
                    metodo="#{servicoCrmReserva.reservarHorario(horario)}"
                    label="Reservar"
                    atualizar="#{paginaAtual.infoPagina.idAreaExbicaoAcaoSelecionada}"
                    estilo="outline"
                    />
                <!--                            </p:commandLink>-->
            </h:form>

        </h:panelGroup>

    </cc:implementation>
</ui:composition>
