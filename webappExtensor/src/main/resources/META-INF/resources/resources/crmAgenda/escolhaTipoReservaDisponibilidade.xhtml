<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:sb="http://superbitsframework/ui"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:crmAgenda="http://xmlns.jcp.org/jsf/composite/crmAgenda"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <!-- INTERFACE -->


    <cc:interface>
        <cc:attribute name="tiposDisponiveis" type="java.util.List" required="true"/>

        <cc:attribute name="agenda" type="br.org.carameloCode.erp.modulo.agenda.entidadesJPA.escopoPesquisa.AgendaDisponibilidade" required="true" />
        <cc:attribute name="atendente" type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.usuariosEPermissao.usuario.UsuarioCRM" rendered="false"  default="#{cc.attrs.agenda.escopo.atendentes[0]}"/>
        <cc:attribute name="metodo"  method-signature="void listener()"  required="true"/>

        <cc:attribute name="areaAtualizacao" />
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet name="agenda.css" library="crmAgenda"/>

        <h:panelGroup styleClass="Container12 OrganizadorContainer" style="" layout="block">
            <c:forEach items="#{cc.attrs.tiposDisponiveis}"
                       var="tipoDisponivel"
                       >
                <h:panelGroup layout="block" styleClass="Container4 "   >




                    <p:commandLink
                        update="#{cc.attrs.areaAtualizacao}"
                        process="@this"
                        actionListener="#{cc.attrs.metodo}"
                        action="#{cc.attrs.metodo}"
                        >
                        <crmAgenda:tipoReserva
                            tipoAgendamento="#{tipoDisponivel}"
                            />
                        <f:setPropertyActionListener target="#{cc.attrs.agenda.tipoAgendamento}" value="#{tipoDisponivel}" />
                    </p:commandLink>

                </h:panelGroup>

            </c:forEach>

        </h:panelGroup>

    </cc:implementation>
</ui:composition>
