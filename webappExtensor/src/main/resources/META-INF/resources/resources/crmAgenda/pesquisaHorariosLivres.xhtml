<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:crmAgenda="http://xmlns.jcp.org/jsf/composite/crmAgenda"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="areaAtualizacao" required="true"/>
        <cc:attribute name="agendaDiponibilidade"
                      default="#{servicoCrmReserva.agendaDisponibilidade}"
                      type="br.org.carameloCode.erp.modulo.agenda.entidadesJPA.escopoPesquisa.AgendaDisponibilidade"
                      required="true"/>
        <cc:attribute name="vagasDisponiveis" default="false"/>
        <cc:attribute name="acaoAgendaRemota"     type="com.super_bits.modulosSB.SBCore.modulos.Controller.Interfaces.acoes.ComoAcaoDoSistema" required="true" />
        <cc:attribute name="acaoAgendaPresencial" type="com.super_bits.modulosSB.SBCore.modulos.Controller.Interfaces.acoes.ComoAcaoDoSistema" required="true" />
        <cc:attribute name="acaoEscolhaTipoEvento" type="com.super_bits.modulosSB.SBCore.modulos.Controller.Interfaces.acoes.ComoAcaoDoSistema" required="true" />


    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <div class="invisivel">
            #{cc.attrs.agendaDiponibilidade.horariosDisponiveis.size()}
        </div>
        <p:fieldset  styleClass="Container12">
            <h:panelGroup styleClass="Container6" layout="block" >
                <p:link href="#{pgUtilAcoes.getUrlAcao(cc.attrs.acaoEscolhaTipoEvento, cc.attrs.atendente,cc.attrs.atendido)}" rendered="#{cc.attrs.agendaDiponibilidade.tipoAgendamento!=null}" >
                    Escolher outro
                </p:link>
                <crmAgenda:tipoReserva
                    rendered="#{cc.attrs.agendaDiponibilidade.tipoAgendamento!=null}"
                    atendente="#{cc.attrs.agendaDiponibilidade.escopo.atendentes[0]}"
                    tipoAgendamento="#{cc.attrs.agendaDiponibilidade.tipoAgendamento}"
                    acaoEscolhaTipoEvento="#{cc.attrs.acaoEscolhaTipoEvento}"
                    atendido="#{cc.attrs.agendaDiponibilidade.usuarioAtendido}"
                    />
            </h:panelGroup>

            <h:panelGroup styleClass="Container6" layout="block" >
                <crmAgenda:dataDisponivel
                    rendered="#{cc.attrs.agendaDiponibilidade.temDadosMinimosConstrucaoAgenda}"
                    areaAtualizacao="#{pgUtil.gerarCaminhoCompletoID('painelHorariosDisponives')}"
                    agendaDiponibilidade="#{servicoCrmReserva.agendaDisponibilidade}"
                    />
            </h:panelGroup>
            <h:panelGroup styleClass="Container12" layout="block" >
                <crmAgenda:escolhaTipoReservaAberturaFormulario
                    acaoEscolhaTipo="#{cc.attrs.acaoEscolhaTipoEvento}"
                    rendered="#{cc.attrs.agendaDiponibilidade.tipoAgendamento==null}"
                    tiposDisponiveis="#{cc.attrs.agendaDiponibilidade.tiposAgendamentoDisponiveis}"
                    acaoAgendaPresencial="#{cc.attrs.acaoAgendaPresencial}"
                    acaoAgendaRemota="#{cc.attrs.acaoAgendaRemota}"
                    atendente="#{cc.attrs.agendaDiponibilidade.usuarioAtendente}"
                    atendido="#{cc.attrs.agendaDiponibilidade.usuarioAtendido}"
                    />
            </h:panelGroup>

        </p:fieldset>
        <h:panelGroup id="painelHorariosDisponives" layout="block"  >
            <p:fragment >

                <crmAgenda:horariosDisponiveis

                    horariosDisponiveis="#{cc.attrs.agendaDiponibilidade.horariosDisponiveis}"
                    rendered="#{cc.attrs.agendaDiponibilidade.horariosDisponiveis.size()>0}"
                    />
            </p:fragment>
        </h:panelGroup>


    </cc:implementation>
</ui:composition>
