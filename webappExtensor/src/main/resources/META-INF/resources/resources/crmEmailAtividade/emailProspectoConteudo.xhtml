<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:CRCCRMIA="http://xmlns.jcp.org/jsf/composite/iaDialogos"
    xmlns:SBCRMMAIL="http://xmlns.jcp.org/jsf/composite/crmEmail"
    xmlns:crmArquivo="http://xmlns.jcp.org/jsf/composite/crmArquivo"
    xmlns:CRMEmail="http://xmlns.jcp.org/jsf/composite/crmEmail"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:sb="http://superbitsframework/ui"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="empresa"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa" required="true"/>

        <cc:attribute name="email"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.mail.envioEmail.envioEmail.EnvioEmail" required="true"/>
        <cc:attribute name="metodoAposAtualizarEmail" type="javax.el.MethodExpression"  required="false" />
        <cc:attribute name="mostarContato" default="true" />
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:form  styleClass="">
            <p:poll
                autoStart="true"

                interval="60"
                listener="#{pgExecutarAtividade.manterConexaoMail()}"
                />


        </h:form>
        <h:panelGroup layout="block" styleClass="Container12" id="areaEdicaoEmail" style="height: auto;">
            <h:panelGroup layout="block" styleClass="Container12" >
                <h:form>
                    <CRCCRMIA:iaInlineEditoraAtividadeEmailVinculado areaAtualizacao="areaEdicaoEmail" />
                </h:form>
                <p:fieldset id="conteudoEmail" styleClass="Container12 conteudoEmail " rendered="#{pgExecutarAtividade.atividade.emailVinculado!=null}" style="height: 600px;" >
                    <h:form style="height: 100%;">

                        <SBInput:input
                            registro="#{pgExecutarAtividade.atividade.emailVinculado.getCampoInstanciadoByNomeOuAnotacao('assunto')}"
                            layout="#{layoutsComponenteSB.layoutCampo.superior}"
                            idAtualizarOnChange="@this"
                            />

                        <CRMEmail:inputEmail
                            email="#{pgExecutarAtividade.atividade.emailVinculado}"
                            autoSave="#{pgExecutarAtividade.emailsalvarRascunho()}"
                            />
                        <p:fragment >

                            <p:poll listener="#{pgExecutarAtividade.emailsalvarRascunho()}"
                                    widgetVar="salvarRascunhoPoll"
                                    intervalType="second"

                                    async="false"
                                    interval="15"
                                    process="@form"
                                    />

                        </p:fragment>
                    </h:form>
                </p:fieldset>
            </h:panelGroup>
        </h:panelGroup>


    </cc:implementation>
</ui:composition>
