<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:p="http://primefaces.org/ui">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="pessoa"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa"
                      required="true"/>

    </cc:interface>
    <cc:implementation>
        <h:outputStylesheet library="crmPessoa" name="opcoes_do_prospecto.css" />
        <h:panelGroup styleClass="Container12 blocoTagsPessoaGrande" layout="block">

            <!-- sem tags: o proprio aviso continua levando para a
                 tela de edicao -->
            <p:link href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmTags,cc.attrs.pessoa)}"
                    styleClass="linkTagsPessoaGrande avisoSemTagsPessoa"
                    rendered="#{cc.attrs.pessoa.tagsAtendimento.size()==0}">
                <p:staticMessage severity="info" summary="Sem tags" detail="Clique para editar" />
            </p:link>

            <!-- cada tag e um link proprio: leva a listagem de
                 prospectos daquela tag para o usuario da sessao.
                 O title mostra o nome completo quando o rotulo e
                 cortado pelo "..." da pastilha. -->
            <h:panelGroup layout="block"
                          styleClass="OrganizadorContainerEsquerda tagsPessoaGrande"
                          rendered="#{cc.attrs.pessoa.tagsAtendimento.size()>0}">
                <c:forEach items="#{cc.attrs.pessoa.tagsAtendimento}" var="tag">
                    <p:link href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_MeusProspectosMbGerenciar.meusProspectosFrmListar,tag,sessaoAtualSBWP.usuario)}"
                            styleClass="itemTagPessoaGrande"
                            title="#{tag.nome}"
                            style="--cor-tag: ##{tag.cor}; border-color: var(--cor-tag);">
                        <span class="labelTagTexto"><i class="fa fa-tag tag-icon"></i> #{tag.nome}</span>
                    </p:link>
                </c:forEach>
            </h:panelGroup>

            <!-- rodape: editar as tags do prospecto (era o link que
                 envolvia o bloco inteiro) -->
            <div class="area-botao-tags">
                <p:link href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmTags,cc.attrs.pessoa)}"
                        styleClass="botao-editar-tags"
                        title="Editar tags">
                    <i class="pi pi-pencil"></i> Editar tags
                </p:link>
            </div>
        </h:panelGroup>
    </cc:implementation>
</ui:composition>
