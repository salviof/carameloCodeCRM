<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:crmDashBoard="http://xmlns.jcp.org/jsf/composite/dashboard"
    xmlns:pe="http://primefaces.org/ui/extensions"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="pessoa"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa" required="true"/>

    </cc:interface>
    <cc:implementation>
        <h:panelGroup styleClass="cards-dashboard "  layout="block"   style="margin:3px;" >


            <crmDashBoard:dashBoardIconeTextoTituloLink
                codigoestilo="3"
                texto="Origem:"
                url="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_MeusProspectosMbGerenciar.meusProspectosFrmListar,cc.attrs.pessoa.origem,sessaoAtualSBWP.usuario)}"
                icone="fa fa-globe"
                titulo="#{cc.attrs.pessoa.origem.nome}"
                valor="1"

                />


            <crmDashBoard:dashBoardIconeTextoTituloLink
                codigoestilo="3"
                texto="Meta:"
                url="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_MeusProspectosMbGerenciar.meusProspectosFrmListar,cc.attrs.pessoa.origem,sessaoAtualSBWP.usuario)}"
                icone="fa fa-dot-circle-o"
                titulo="#{pgProspecto.prospecto.relacionamento.metaRelacionamento.nome}"
                valor="1"
                />


            <crmDashBoard:dashBoardIconeTextoTituloLink
                codigoestilo="3"
                texto="Email Marketing"
                url="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_MeusProspectosMbGerenciar.meusProspectosFrmListar,cc.attrs.pessoa.origem,sessaoAtualSBWP.usuario)}"
                icone="fa fa-solid fa-envelope-open-text"
                titulo=""
                valor="1"
                />

            <crmDashBoard:dashBoardIconeTextoTituloLink
                codigoestilo="3"

                url="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_MeusProspectosMbGerenciar.meusProspectosFrmListar,cc.attrs.pessoa.origem,sessaoAtualSBWP.usuario)}"
                icone="fa fa fa-money"
                titulo="R$#{cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('quantidadeAtividadesLead').valor*10},00"
                texto="Valor Investido:"
                valor="1"
                />

        </h:panelGroup>








    </cc:implementation>
</ui:composition>
