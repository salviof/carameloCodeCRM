
<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:sb="http://superbitsframework/ui"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:CRCAcaoContexto="http://xmlns.jcp.org/jsf/composite/SBComp/composite/paginaAtualDeEntidade"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">



    <!-- INTERFACE -->
    <cc:interface
        shortDescription="Mostra a area de ocumpação de uma div, pontilhada, e informações sobre o modelo selecionado, e a àrea do modelo"
        >

        <cc:attribute
            type="com.super_bits.modulosSB.SBCore.modulos.view.modeloFormulario.ModeloPagina"
            name="modelo"
            required="true"
            shortDescription="Modelo da Pagina"
            />

        <cc:attribute
            type="java.lang.String"
            name="nomeArea"
            required="true"
            shortDescription="Modelo da Pagina"
            />

    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet  name="modeloPagina/areaModeloPagina.css" library="carameloStore"   />
        <h:panelGroup layout="block"
                      styleClass="Container12 AreaDoModelo #{cc.attrs.modelo.umaSubPagina ? 'AreaDoModelo--subpagina' : 'AreaDoModelo--geral'}">

            <h:panelGroup styleClass="AreaDoModelo-rotulo" layout="block">
                <i class="fa fa-vector-square AreaDoModelo-icone" aria-hidden="true"></i>
                <span class="AreaDoModelo-nome">#{cc.attrs.nomeArea}</span>

                <h:panelGroup layout="block" styleClass="AreaDoModelo-acoes"
                              rendered="#{!cc.attrs.modelo.umaSubPagina}">
                    <h:form>
                        <CRCAcaoContexto:botaoAcaoPersonalizada
                            javaScriptOncomplete="location.reload();"
                            acao="#{acoesCarameloDev_FormmularioPersonalizadoMbGestao.formmularioPersonalizadoFrmListar}" />
                    </h:form>
                </h:panelGroup>

            </h:panelGroup>
        </h:panelGroup>

    </cc:implementation>
</ui:composition>
