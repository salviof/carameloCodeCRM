<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:crmContato="http://xmlns.jcp.org/jsf/composite/crmContato">
    <!-- INTERFACE: mesmos parâmetros de envioMsgWtsapp -->
    <cc:interface>
        <cc:attribute name="contato"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.contatoProspecto.ContatoProspecto" required="true"/>
        <cc:attribute name="mensagem" type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.wtzpModeloMKT.MensagemMktWhatsapp" />

    </cc:interface>
    <cc:implementation>
        <h:outputStylesheet name="envioMsgModalWtsapp.css" library="crmContato"/>
        <h:panelGroup layout="block" styleClass="crc-envio-msg-modal-wtsapp" rendered="#{not empty cc.attrs.mensagem}">

            <!-- BOTAO QUE ABRE O MODAL -->
            <button type="button"
                    class="crc-envio-msg-modal-wtsapp__botao"
                    title="Enviar WhatsApp Marketing para #{cc.attrs.contato.nome}"
                    onclick="PF('dlgEnvioWtsapp_#{cc.clientId.replaceAll(':', '_')}').show(); return false;">
                <i class="fa-brands fa-whatsapp crc-envio-msg-modal-wtsapp__botao-icone"></i>
                <span class="crc-envio-msg-modal-wtsapp__botao-texto">Enviar WhatsApp Marketing</span>
            </button>

            <!-- MODAL COM O COMPONENTE DE ENVIO -->
            <p:dialog widgetVar="dlgEnvioWtsapp_#{cc.clientId.replaceAll(':', '_')}"
                      header="WhatsApp Marketing"
                      modal="true"
                      appendTo="@(body)"
                      responsive="true"
                      resizable="false"
                      draggable="false"
                      closeOnEscape="true"
                      fitViewport="true"
                      styleClass="crc-envio-msg-modal-wtsapp__dialogo">
                <!-- Form próprio do modal: o envioMsgWtsapp não tem form e atualiza o form em volta (@form) -->
                <h:form id="formEnvioMsgModalWtsapp">
                    <crmContato:envioMsgWtsapp contato="#{cc.attrs.contato}" mensagem="#{cc.attrs.mensagem}" />
                </h:form>
            </p:dialog>

        </h:panelGroup>
    </cc:implementation>
</ui:composition>
