<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:p="http://primefaces.org/ui"
    xmlns:pe="http://primefaces.org/ui/extensions"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="reserva"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.agenda.ReservaHoraRemotoVideo"
                      required="true"/>
        <cc:attribute name="podeEditarCliente" type="java.lang.Boolean" default="false" />
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <style>
            #j_idt1174:j_idt1176:detalhesReuniao .campoSB{
                width: 500px;
            }

        </style>
        <p:fieldset legend="Dados da reserva"  id="dadosReserva" styleClass="Container12" >
            <h:panelGroup styleClass="Container12 OrganizadorContainerEsquerda"  layout="block" id="atendidos">
                <h:panelGroup styleClass="Container3"  layout="block">
                    <SBInput:input registro="#{cc.attrs.reserva.getCampoInstanciadoByNomeOuAnotacao('pessoaRelacionada')}"
                                   label="Cliente"
                                   layout="#{layoutsComponenteSB.layoutCampo.superior}"
                                   idAtualizarOnChange="atendidos"
                                   desabilitarEdicao="#{!cc.attrs.podeEditarCliente}"
                                   />


                </h:panelGroup>

                <SBInput:input registro="#{pgMinhasReservas.entidadeSelecionada.getCampoInstanciadoByNomeOuAnotacao('tipoAgendamento')}"
                               layout="#{layoutsComponenteSB.layoutCampo.superior}"
                               desabilitarEdicao="true"
                               />

                <SBInput:input registro="#{pgMinhasReservas.entidadeSelecionada.getCampoInstanciadoByNomeOuAnotacao('inicioReservaAtendente')}"
                               layout="#{layoutsComponenteSB.layoutCampo.esquerda}"
                               idAtualizarOnChange="@this"
                               />

                <SBInput:input registro="#{pgMinhasReservas.novaReserva.getCampoInstanciadoByNomeOuAnotacao('finalReservaAtendente')}"
                               layout="#{layoutsComponenteSB.layoutCampo.esquerda}"
                               />



                <h:panelGroup styleClass="Container6 " id="contatosConvidados"  layout="block" rendered="#{cc.attrs.reserva.getCampoInstanciadoByNomeOuAnotacao('pessoaRelacionada').valor!=null}">
                    <SBInput:input registro="#{cc.attrs.reserva.getCampoInstanciadoByNomeOuAnotacao('contatosAtendidos')}"
                                   label="Contatos Convidados"
                                   layout="#{layoutsComponenteSB.layoutCampo.superior}"
                                   idAtualizarOnChange="contatosConvidados"

                                   />
                </h:panelGroup>

                <h:panelGroup styleClass="Container6 " style=""  layout="block" id="detalhesReuniao">
                    <SBInput:input registro="#{cc.attrs.reserva.getCampoInstanciadoByNomeOuAnotacao('linkConferencia')}"
                                   label="Link da conferência"

                                   layout="#{layoutsComponenteSB.layoutCampo.superior}"
                                   idAtualizarOnChange="contatosConvidados"
                                   />
                </h:panelGroup>
            </h:panelGroup>



        </p:fieldset>


    </cc:implementation>
</ui:composition>
