<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:SBComp="http://xmlns.jcp.org/jsf/composite/SBComp"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="#{layoutsPaginas.conteudoEmBranco.xhtmlVinculado}"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:define name="conteudo">
        <h:panelGroup layout="bock" styleClass="Container12 OrganizadorContainer" >
            <h:form >

                <SBInput:input  registro="#{pgClienteMinhasSolicitacoes.entidadeSelecionada.getCampoInstanciadoByNomeOuAnotacao('pessoa')}"
                                desabilitarEdicao="#{true}"
                                idAtualizarOnChange="@this"
                                layout="#{layoutsComponenteSB.layoutCampo.superior}" />


                <p:staticMessage severity="info"
                                 summary="#{pgClienteMinhasSolicitacoes.entidadeSelecionada.usuarioSolicitado.nome}, quer saber:"
                                 detail="#{pgClienteMinhasSolicitacoes.entidadeSelecionada.observacao}"
                                 />



                <SBInput:input registro="#{pgClienteMinhasSolicitacoes.entidadeSelecionada.getCampoInstanciadoByNomeOuAnotacao('dataHoraDataProgramada')}"
                               idAtualizarOnChange="@this"
                               desabilitarEdicao="true"
                               layout="#{layoutsComponenteSB.layoutCampo.superior}" />


                <SBInput:input registro="#{pgClienteMinhasSolicitacoes.entidadeSelecionada.getCampoInstanciadoByNomeOuAnotacao('descricaoConfirmacao')}"
                               idAtualizarOnChange="@this"
                               desabilitarEdicao="false"
                               layout="#{layoutsComponenteSB.layoutCampo.superior}" />




                <ui:repeat value="#{pgClienteMinhasSolicitacoes.entidadeSelecionada.getCampoInstanciadoByNomeOuAnotacao('respostasPossiveis').valor}" var="resp" >
                    <h:panelGroup layout="block" styleClass="Container3" style="margin: 3px;" >
                        <p:commandButton

                            style="background-color: #{resp.cor}"
                            styleClass="btnIconeENome botao "
                            icon="#{resp.icone}"
                            action="#{pgClienteMinhasSolicitacoes.executarAcaoSelecionada()}"
                            value="#{resp.nome}"
                            update="@form"

                            >
                            <f:setPropertyActionListener target="#{pgClienteMinhasSolicitacoes.acaoSelecionada}"
                                                         value="#{acoesClienteContato_SolicitacaoMbGestao.solicitacaoCtrResponderAceite}"  />
                            <f:setPropertyActionListener target="#{pgClienteMinhasSolicitacoes.entidadeSelecionada.tipoRespostaSelecionada}"
                                                         value="#{resp}"  />
                        </p:commandButton>
                    </h:panelGroup>
                </ui:repeat>



            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
