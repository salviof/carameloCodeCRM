<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:crm="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:crmDashBoard="http://xmlns.jcp.org/jsf/composite/dashboard"
    template="#{layoutsPaginas.modeloGeral.xhtmlVinculado}"
    xmlns:p="http://primefaces.org/ui"

    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="divConteudo">

        <h:panelGroup id="divSBAreaAcaoSelecionada" styleClass="Container12" style="" layout="block" >

            <h:panelGroup layout="block" styleClass="Container12" >
                <p:fieldset legend="Usuário" style="margin: 32px;"  >
                    <f:facet name="legend" >

                        <h:form>


                            <h:panelGroup layout="block" styleClass="Container3 Fleft" >

                                <h:panelGroup layout="block" styleClass="Container2" style="position: relative; min-width: 40px; padding-bottom: 10px; margin-top: 5px;" >
                                    <crm:avatar somenteLeitura="true" usuario="#{pgAdministrativo.pesquisaLead.usuario}" />
                                </h:panelGroup>
                                <h:panelGroup layout="block" styleClass="Container7" style="" >
                                    <SBInput:input registro="#{pgAdministrativo.pesquisaLead.getCampoInstanciadoByNomeOuAnotacao('usuario')}"
                                                   layout="#{layoutsComponenteSB.layoutCampo.semLabel}"
                                                   idAtualizarOnChange="divSBAreaAcaoSelecionada"
                                                   />
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:form>
                    </f:facet>

                    <div class="quebraBlocoComEspacoVertical10" />

                    <crmDashBoard:meusCompromissosAtendimento dadosDeLead="#{pgAdministrativo.pesquisaLead}" />

                    <crmDashBoard:meusCompromissosLead dadosDeLead="#{pgAdministrativo.pesquisaLead}" />

                    <crmDashBoard:minhasOrigens dadosDeLead="#{pgAdministrativo.pesquisaLead}" />
                    <crmDashBoard:meusLeadsVisaoGeral dadosDeLead="#{pgAdministrativo.pesquisaLead}" />
                </p:fieldset>
            </h:panelGroup>

        </h:panelGroup>
        <h:panelGroup styleClass="Fright" layout="block" >
            <p:clock pattern="dd/MM/yyyy HH:mm:ss" mode="server"/>
        </h:panelGroup>
    </ui:define>
</ui:composition>
