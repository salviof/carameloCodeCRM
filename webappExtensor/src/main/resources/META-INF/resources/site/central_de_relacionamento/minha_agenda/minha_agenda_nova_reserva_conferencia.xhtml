<!-- template conteúdo com formulario-->
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:SBReserva="http://xmlns.jcp.org/jsf/composite/reserva"
    xmlns:SBBotoes="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:SBCrm="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:SBFormulario="http://xmlns.jcp.org/jsf/composite/SBComp/composite/formulario"
    xmlns:SBPaginaAtual="http://xmlns.jcp.org/jsf/composite/SBComp/composite/paginaAtualDeEntidade"

    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:crmAgenda="http://xmlns.jcp.org/jsf/composite/crmAgenda">


    <div class="">
        <div class="CardTopic" style="height: 170px;">
            #{paginaAtual.infoPagina.acaoSelecionada.nomeAcao}
            <i class="#{paginaAtual.infoPagina.acaoSelecionada.iconeAcao} Fs30 Fleft MarRight10"></i>
            <br/>
            <div class="quebraBlocoComEspacoVertical10 somenteMobile"></div>

            <span class="CardSubTopic">
                #{paginaAtual.infoPagina.acaoSelecionada.descricao}

            </span>

            <h:panelGroup styleClass="Fright">

            </h:panelGroup>

        </div>



        <div class="ContainerIndent">

            <h:form>



                <h:panelGroup styleClass="Container5"  layout="block">
                    <p:staticMessage severity="info" rendered="#{!servicoCrmReserva.agendaDisponibilidade.temDadosMinimosConstrucaoAgenda}" summary="Informaçoes básicas para tipo de maracaçao não informado" detail="Defina o tipo de Marcação" />
                    <SBReserva:reservaConferenciaEdicao

                        podeEditarCliente="#{pgMinhasReservas.usuarioCliente==null}"
                        reserva="#{pgMinhasReservas.entidadeSelecionada}"
                        rendered="#{servicoCrmReserva.agendaDisponibilidade.temDadosMinimosConstrucaoAgenda}"
                        />
                </h:panelGroup>
                <h:panelGroup styleClass="Container5"  layout="block">
                    <crmAgenda:pesquisaHorariosLivres
                        acaoAgendaPresencial="#{acoesAtendimentoCrm_MinhaAgendaMbGestao.minhaAgendaFrmNovaReserva}"
                        acaoAgendaRemota="#{acoesAtendimentoCrm_MinhaAgendaMbGestao.minhaAgendaFrmNovaReserva}"
                        acaoEscolhaTipoEvento="#{acoesAtendimentoCrm_MinhaAgendaMbGestao.minhaAgendaFrmNovaReserva}"
                        agendaDiponibilidade="#{servicoCrmReserva.agendaDisponibilidade}"
                        areaAtualizacao="@form"
                        />
                </h:panelGroup>
                <p:fieldset  styleClass="Container3 Fright">
                    <h:panelGroup class="Container12" layout="block" >
                        <SBBotoes:botaoDeAcao
                            metodo="${pgMinhasReservas.executarAcaoSelecionada()}" acao="#{acoesAtendimentoCrm_MinhaAgendaMbGestao.minhaAgendaCtrSalvarReservaMerge}"
                            armazenamentoAcaoExecutada="#{pgMinhasReservas.acaoSelecionada}"
                            classeEstilo="botaoVerde"
                            tipoVisualizacao="#{layoutsComponenteSB.layoutBotoes.iconeENome}"
                            />

                    </h:panelGroup>
                </p:fieldset>
            </h:form>


        </div>
    </div>




</ui:composition>
