<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:SBComp="http://xmlns.jcp.org/jsf/composite/SBComp"
    xmlns:RC="http://xmlns.jcp.org/jsf/composite/rocketChat"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="modeloEdicaoProspecto.xhtml" >
    <ui:define name="conteudo">

        <h:outputStylesheet name="opcoes_do_prospecto.css" library="crmPessoa" />

        <h:panelGroup layout="block" styleClass="ChatEquipe Container12" >

            <!-- CABECALHO: a foto da sala de reuniao e o fundo desta faixa.
                 A imagem entra como <img> (e nao como background-image) para
                 que o recorte "cover" venha do object-fit/object-position e a
                 URL do recurso JSF fique fora do CSS. O texto vive sobre um
                 veu escuro + pastilha translucida, garantindo leitura
                 qualquer que seja o trecho da foto exibido. -->
            <h:panelGroup layout="block" styleClass="ChatEquipe-cabecalho Container12" >

                <img class="ChatEquipe-cabecalho-fundo"
                     src="#{resource['/img/salaAguardandoReuniao.jpg']}"
                     alt="" aria-hidden="true" />

                <h:panelGroup layout="block" styleClass="ChatEquipe-cabecalho-conteudo" >

                    <h:panelGroup layout="block" styleClass="ChatEquipe-cabecalho-marca" >
                        <i class="fa-solid fa-comments" aria-hidden="true"></i>
                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="ChatEquipe-cabecalho-textos" >
                        <span class="ChatEquipe-cabecalho-rotulo">Sala interna da equipe</span>
                        <h2 class="ChatEquipe-cabecalho-titulo">#{pgProspecto.entidadeSelecionada.nome}</h2>
                        <span class="ChatEquipe-cabecalho-descricao">
                            Atendimento e producao alinham aqui a execucao do trabalho
                            deste cliente: combinados, prazos, duvidas e repasses.
                        </span>
                        <span class="ChatEquipe-cabecalho-aviso">
                            <i class="fa-solid fa-lock" aria-hidden="true"></i>
                            Conversa privada da equipe &#8212; o cliente nao participa nem ve estas mensagens
                        </span>
                    </h:panelGroup>

                </h:panelGroup>
            </h:panelGroup>

            <h:panelGroup layout="block" styleClass="ChatEquipe-conteudo Container12 OrganizadorContainer" >

                <h:panelGroup styleClass="ChatEquipe-sala Container12" layout="block" >
                    <RC:salaDebate
                        canal="#{servicoChatView.getSalaDebate(pgProspecto.entidadeSelecionada)}"
                        altura="600px"
                        rendered="#{servicoChatView.getSalaDebate(pgProspecto.entidadeSelecionada)!=null}"
                        />
                    <h:panelGroup layout="block" styleClass="ChatEquipe-depuracao Container12"
                                  rendered="#{infoWebApp.emModoDesenvolvimentoHomologacao}" >
                        <h1>#{servicoChatView.urlSala}</h1>
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGroup>
        </h:panelGroup>
    </ui:define>
</ui:composition>
