<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:CRCListagem="http://xmlns.jcp.org/jsf/composite/carameloStore/listagem"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:crmPessoa="http://xmlns.jcp.org/jsf/composite/crmPessoa"
    xmlns:crm="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:SBListagem="http://xmlns.jcp.org/jsf/composite/SBComp/composite/listagens"
    template="#{layoutsPaginas.formularioListarGenerico.xhtmlVinculado}"
    xmlns:p="http://primefaces.org/ui">
    <ui:define name="conteudo" >

        <p:staticMessage severity="info" detail="#{pgMeusOrcamentos.pessoaSelecionada.nome}" rendered="#{pgMeusOrcamentos.mostrarApenasOrcamentoDaPessoa}"
                         summary="Orçamentos do prospecto"/>



        <CRCListagem:listaAcaoUnica
            acaoExecucao="#{paginaAtual.infoPagina.comoPaginaEntidade.acoesRegistros[0]}"
            itemSelecionado="#{paginaAtual.infoPagina.comoPaginaEntidade.entidadeSelecionada}"

            />
        <crm:menuProspecto  pessoaJuridica="#{pgMeusOrcamentos.pessoaSelecionada}"
                            rendered="#{pgMeusOrcamentos.pessoaSelecionada!=null}"
                            />
    </ui:define>
</ui:composition>
