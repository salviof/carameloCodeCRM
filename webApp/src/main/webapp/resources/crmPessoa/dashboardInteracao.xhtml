
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:crmPessoa="http://xmlns.jcp.org/jsf/composite/crmPessoa"
    xmlns:crmDashBoard="http://xmlns.jcp.org/jsf/composite/dashboard"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:CRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <cc:interface>
        <cc:attribute name="pessoa" required="true"/>
    </cc:interface>

    <cc:implementation>

        <!-- ============================================================
             Acoes que nao sao navegacao por URL, expostas como
             remoteCommand para os cards chamarem via javascript:
             ============================================================ -->
        <h:form>
            <p:remoteCommand name="abrirResumoAtividadesLead"
                             process="@this"
                             update="#{pgUtil.gerarCaminhoCompletoID('dlgResumoAtividades')}"
                             oncomplete="PF('dlgResumoAtividadesWidget').show(); desbloquearArea('#{pgUtil.gerarCaminhoCompletoID('cardsInteracao')}');"/>
        </h:form>

        <h:form id="frmNovaAtividade">
            <p:remoteCommand name="novaAtividadeLead"
                             process="@this"
                             update="@form"
                             oncomplete="desbloquearArea('#{pgUtil.gerarCaminhoCompletoID('cardsInteracao')}');"
                             action="#{paginaAtual.infoPagina.executarAcaoSelecionada}">
                <f:setPropertyActionListener
                    target="#{paginaAtual.infoPagina.comoFormularioWeb.acaoSelecionada}"
                    value="#{acoesAtendimentoCrm_ExecucaoAtividadeMb.execucaoAtividadeFrmAtividadeEscolherAtividade}"/>
            </p:remoteCommand>
        </h:form>

        <!-- ============================================================
             Cards padronizados com o mesmo componente do dashboard.
             O wrapper cards-dashboard componente neutraliza o grid
             CRC (Container*/floats) que o componente traz e impoe um
             CSS Grid responsivo que quebra linha em qualquer zoom.
             ============================================================ -->
        <h:panelGroup layout="block" id="cardsInteracao" styleClass="cards-dashboard cards-dashboard--componente">

            <crmDashBoard:dashBoardIconeValorTituloLink
                codigoestilo="1"
                icone="fa fa-life-ring"
                url="#{pgUtilAcoes.getUrlAcao(acoesAtendimentoCrm_MeusChamadosMbGestao.meusChamadosFrmListarChamadosEmAtendimento, cc.attrs.pessoa.contatoPrincipal.getCampoInstanciadoByNomeOuAnotacao('usuarioVinculado').valor)}"
                titulo="Chamados"
                valor="#{cc.attrs.pessoa.chamadosAbertos.size()}"
                />

            <crmDashBoard:dashBoardIconeValorTituloLink
                codigoestilo="3"
                icone="fa fa-hand-paper-o"
                url="#{pgUtilAcoes.getUrlAcao(acoesAtendimentoCrm_SolicitacaoMbGestao.solicitacaoFrmListarSolicitacoesPessoa, cc.attrs.pessoa)}"
                titulo="Solicitações"
                valor="#{cc.attrs.pessoa.solicitacoesAbertas.size()}"
                />

            <!-- Sempre visivel: o proprio componente aplica o visual de
                 desativado quando valor == 0, e o dialog ja trata a lista
                 vazia com a mensagem de aviso. -->
            <crmDashBoard:dashBoardIconeValorTituloLink
                codigoestilo="2"
                icone="fa fa-play-circle-o"
                url="javascript:abrirResumoAtividadesLead();"
                titulo="Continuar atividade"
                valor="#{cc.attrs.pessoa.atividadesEmAndamento.size()}"
                />

            <crmDashBoard:dashBoardIconeTextoTituloLink
                texto=""
                codigoestilo="2"
                icone="fa fa-play"
                url="javascript:novaAtividadeLead();"
                titulo="Nova atividade"
                valor="1"
                />

        </h:panelGroup>

        <p:dialog id="dlgResumoAtividades"
                  widgetVar="dlgResumoAtividadesWidget"
                  header="Atividades em andamento"
                  modal="true"
                  width="480"
                  responsive="true"
                  closable="true">

            <!-- Quando houver atividades -->
            <h:panelGroup rendered="#{pgProspecto.prospecto.atividadesEmAndamento.size() > 0}">
                <c:forEach var="atividade" items="#{pgProspecto.prospecto.atividadesEmAndamento}" >

                    <CRM:botaoEditarAtividade  atividade="#{atividade}"/>
                    <br/>
                </c:forEach>

            </h:panelGroup>
            <!-- Quando NÃO houver atividades -->
            <h:panelGroup rendered="#{pgProspecto.prospecto.atividadesEmAndamento.size() == 0}">
                <div class="alert alert-warning Fs14" style="padding:12px;">
                    Não possui atividades em andamento.
                </div>
            </h:panelGroup>
        </p:dialog>
    </cc:implementation>
</ui:composition>
