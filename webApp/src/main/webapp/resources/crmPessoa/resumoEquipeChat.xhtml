<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:crm="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <cc:interface>
        <cc:attribute name="pessoa"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa"
                      required="true"/>
    </cc:interface>

    <cc:implementation>
        <h:form id="formEquipe">
            <p:card styleClass="card-equipe-responsavel">
                <f:facet name="title">
                    <h:panelGroup layout="block" styleClass="titulo-equipe">
                        <i class="pi pi-users"></i>
                        <h:outputText value="Equipe Responsável (#{cc.attrs.pessoa.usuariosResponsaveis.size()})"/>

                    </h:panelGroup>
                </f:facet>

                <h:panelGroup layout="block" styleClass="time-responsavel">

                    <h:panelGroup layout="block" styleClass="destaques-equipe"
                                  rendered="#{cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('usuarioAtendimento').valor != null or cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('usuarioResponsavel').valor != null}">

                        <p:panel styleClass="painel-usuario-destaque"
                                 rendered="#{cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('usuarioAtendimento').valor != null}">
                            <h:panelGroup styleClass="card-usuario card-usuario-destaque">

                                <h:panelGroup styleClass="info-usuario">
                                    <crm:avatar usuario="#{cc.attrs.pessoa.usuarioAtendimento}" somenteLeitura="#{true}"/>

                                    <h:panelGroup styleClass="dados-usuario">
                                        <h:panelGroup layout="block" styleClass="papeis-usuario">
                                            <h:panelGroup layout="block" styleClass="papel-usuario papel-gestor">
                                                <i class="pi pi-star"/>
                                                <h:outputText value="Gestor de Sucesso"/>

                                                <p:commandLink actionListener="#{servicoCRMContato.desPromoverAtendimento(pUsuario)}"
                                                               update="@form"
                                                               styleClass="botao-promover botao-promover-representante"
                                                               title="Destituir #{usuario.nome} de responsável pelo atendimento"
                                                               rendered="#{paginaAtual.usuarioCrmLogado.umUsuarioAdmin}"
                                                               >
                                                    <span class="icone-promover">
                                                        <i class="fa-solid fa-hand-holding-heart icone-papel"></i>
                                                        <i class="fa-solid fa-circle-arrow-down badge-seta"></i>
                                                    </span>
                                                </p:commandLink>
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="papel-usuario papel-representante"
                                                          rendered="#{cc.attrs.pessoa.usuarioAtendimento.equals(cc.attrs.pessoa.usuarioResponsavel)}">
                                                <i class="fa fa-handshake-o"/>
                                                <h:outputText value="Representante Comercial"/>
                                            </h:panelGroup>
                                        </h:panelGroup>

                                        <h:outputText value="#{cc.attrs.pessoa.usuarioAtendimento.nome}"
                                                      styleClass="texto-ellipsis nome-usuario"/>

                                        <h:outputText value="#{cc.attrs.pessoa.usuarioAtendimento.email}"
                                                      styleClass="texto-ellipsis"/>

                                        <h:outputText value="#{cc.attrs.pessoa.usuarioAtendimento.telefone}"
                                                      styleClass="texto-ellipsis"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                                <h:panelGroup styleClass="botoes-acao">
                                    <p:button href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_SolicitacaoMbGestao.solicitacaoFrmListarSolicitacoesPessoa,cc.attrs.pessoa,cc.attrs.pessoa.usuarioAtendimento)}"
                                              icon="fa fa-hand-paper-o"
                                              title="Solicitar Ajuda"/>




                                    <p:commandButton
                                        icon="fa-solid fa-table-tennis-paddle-ball"
                                        title="Passar a bola"
                                        styleClass="botao-acao"
                                        rendered="#{sessaoAtualSBWP.usuario.equals(cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('usuarioResponsavel').valor) and !cc.attrs.pessoa.usuarioAtendimento.equals(cc.attrs.pessoa.usuarioResponsavel)}"
                                        action="#{pgProspecto.passarABola}"
                                        update="@form">

                                        <p:confirm
                                            header="Passar a bola para #{cc.attrs.pessoa.usuarioAtendimento.nome}?"
                                            message="Você perderá o poder de gerir os responsáveis ao fazer esta alteração."
                                            icon="fa-solid fa-table-tennis-paddle-ball"/>

                                        <f:setPropertyActionListener
                                            target="#{cc.attrs.pessoa.usuarioResponsavel}"
                                            value="#{cc.attrs.pessoa.usuarioAtendimento}"/>

                                    </p:commandButton>
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:panel>

                        <p:panel styleClass="painel-usuario-destaque"
                                 rendered="#{cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('usuarioResponsavel').valor != null and !cc.attrs.pessoa.usuarioResponsavel.equals(cc.attrs.pessoa.usuarioAtendimento)}">
                            <h:panelGroup styleClass="card-usuario card-usuario-destaque">

                                <h:panelGroup styleClass="info-usuario">
                                    <crm:avatar usuario="#{cc.attrs.pessoa.usuarioResponsavel}" somenteLeitura="#{true}"/>

                                    <h:panelGroup styleClass="dados-usuario">
                                        <h:panelGroup layout="block" styleClass="papeis-usuario">
                                            <h:panelGroup layout="block" styleClass="papel-usuario papel-representante">
                                                <i class="fa fa-handshake-o"/>
                                                <h:outputText value="Representante Comercial"/>

                                                <p:commandLink actionListener="#{servicoCRMContato.desPromoverAtendimento(usuario)}"
                                                               update="@form"
                                                               styleClass="botao-promover botao-promover-representante"
                                                               title="Destituir #{usuario.nome} de Representante Comercial"
                                                               rendered="#{paginaAtual.usuarioCrmLogado.umUsuarioAdmin}"
                                                               >
                                                    <span class="icone-promover">
                                                        <i class="fa-solid fa-handshake icone-papel"></i>
                                                        <i class="fa-solid fa-circle-arrow-down badge-seta"></i>
                                                    </span>
                                                </p:commandLink>

                                            </h:panelGroup>
                                        </h:panelGroup>

                                        <h:outputText value="#{cc.attrs.pessoa.usuarioResponsavel.nome}"
                                                      styleClass="texto-ellipsis nome-usuario"/>

                                        <h:outputText value="#{cc.attrs.pessoa.usuarioResponsavel.email}"
                                                      styleClass="texto-ellipsis"/>

                                        <h:outputText value="#{cc.attrs.pessoa.usuarioResponsavel.telefone}"
                                                      styleClass="texto-ellipsis"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                                <h:panelGroup styleClass="botoes-acao">
                                    <p:button href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_SolicitacaoMbGestao.solicitacaoFrmListarSolicitacoesPessoa,cc.attrs.pessoa,cc.attrs.pessoa.usuarioResponsavel)}"
                                              icon="fa fa-hand-paper-o"
                                              title="Solicitar Ajuda"/>
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:panel>

                        <h:panelGroup layout="block" styleClass="acoes-destaques-equipe"
                                      rendered="#{servicosCRM.isUsuarioTemPermissao(cc.attrs.pessoa) and (pgProspecto.prospecto.usuarioResponsavel ne paginaAtual.usuarioCrmLogado)}">
                            <p:commandButton
                                styleClass="btnIconeENome botao"
                                update="@form"
                                icon="Fs20 #{acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoCtrAssumir.icone}"
                                value="#{acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoCtrAssumir.nome}"
                                action="#{pgProspecto.executarAcao(pgProspecto.entidadeSelecionada)}">
                                <f:setPropertyActionListener target="#{pgProspecto.acaoSelecionada}"
                                                             value="#{acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoCtrAssumir}"/>
                            </p:commandButton>
                        </h:panelGroup>
                    </h:panelGroup>

                    <ui:repeat value="#{cc.attrs.pessoa.usuariosResponsaveis}" var="usuario">
                        <p:panel rendered="#{!usuario.equals(cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('usuarioAtendimento').valor) and !usuario.equals(cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('usuarioResponsavel').valor)}">
                            <h:panelGroup styleClass="card-usuario">

                                <h:panelGroup styleClass="info-usuario">
                                    <crm:avatar usuario="#{usuario}" somenteLeitura="#{true}"/>

                                    <h:panelGroup styleClass="dados-usuario">
                                        <h:outputText value="#{usuario.nome}"
                                                      styleClass="texto-ellipsis nome-usuario"/>

                                        <h:outputText value="#{usuario.email}"
                                                      styleClass="texto-ellipsis"/>

                                        <h:outputText value="#{usuario.telefone}"
                                                      styleClass="texto-ellipsis"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                                <h:panelGroup styleClass="botoes-acao">

                                    <h:panelGroup layout="block" styleClass="PromocaoAtendimento" >
                                        <p:commandLink actionListener="#{servicoCRMContato.promoverRepresentanteComercial(usuario)}"
                                                       update="@form"
                                                       styleClass="botao-promover botao-promover-representante"
                                                       title="Promover #{usuario.nome} a Representante Comercial"
                                                       rendered="#{paginaAtual.usuarioCrmLogado.umUsuarioAdmin or usuario.equals(cc.attrs.pessoa.usuarioResponsavel)}"
                                                       >
                                            <span class="icone-promover">
                                                <i class="fa-solid fa-handshake icone-papel"></i>
                                                <i class="fa-solid fa-circle-arrow-up badge-seta"></i>
                                            </span>
                                        </p:commandLink>


                                        <p:commandLink actionListener="#{servicoCRMContato.promoverResponsavelAtendimento(usuario)}"
                                                       update="@form"
                                                       styleClass="botao-promover botao-promover-gestor"
                                                       title="Promover #{usuario.nome} a Gestor de Sucesso"
                                                       >
                                            <span class="icone-promover">
                                                <i class="fa-solid fa-hand-holding-heart icone-papel"></i>
                                                <i class="fa-solid fa-circle-arrow-up badge-seta"></i>
                                            </span>
                                        </p:commandLink>

                                    </h:panelGroup>


                                    <p:button href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_SolicitacaoMbGestao.solicitacaoFrmListarSolicitacoesPessoa,cc.attrs.pessoa,usuario)}"
                                              icon="fa fa-hand-paper-o"
                                              title="Solicitar Ajuda"/>



                                    <p:commandButton
                                        icon="fa-solid fa-table-tennis-paddle-ball"
                                        title="Passar a bola"
                                        styleClass="botao-acao"
                                        rendered="#{sessaoAtualSBWP.usuario.equals(cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('usuarioResponsavel').valor) and !usuario.equals(cc.attrs.pessoa.usuarioResponsavel)}"
                                        action="#{pgProspecto.passarABola}"
                                        update="@form">

                                        <p:confirm
                                            header="Passar a bola para #{usuario.nome}?"
                                            message="Você perderá o poder de gerir os responsáveis ao fazer esta alteração."
                                            icon="fa-solid fa-table-tennis-paddle-ball"/>

                                        <f:setPropertyActionListener
                                            target="#{cc.attrs.pessoa.usuarioResponsavel}"
                                            value="#{usuario}"/>

                                    </p:commandButton>
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:panel>
                    </ui:repeat>
                </h:panelGroup>

                <f:facet name="footer">
                    <h:panelGroup layout="block" styleClass="acoes-equipe">
                        <p:commandButton
                            icon="pi pi-comments"
                            value="Abrir chat debate interno"
                            styleClass="btn-equipe btn-equipe-primario"
                            actionListener="#{servicosCRM.abrirPaginaDeProspecto(cc.attrs.pessoa,acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmChatEquipe)}"
                            immediate="true"
                            ajax="false"/>
                        <p:commandButton
                            icon="pi pi-pencil"
                            value="Editar Equipe"
                            styleClass="btn-equipe btn-equipe-secundario"
                            rendered="#{cc.attrs.pessoa.getCampoInstanciadoByNomeOuAnotacao('atendenteLogadoResponsavelPrincipal').valorComoBoolean}"
                            actionListener="#{servicosCRM.exibirModalProspecto(cc.attrs.pessoa,acoesAtendimentoCrm_ModalCrmMbProspectos.modalCrmFrmCompartilharProspecto)}"
                            update="@form">
                            <p:ajax event="click" listener="#{paginaAtual.comoPaginaComModal.onModalProspectoOpen}"/>
                            <p:ajax event="dialogReturn"
                                    listener="#{paginaAtual.comoPaginaComModal.onModalProspectoClose}"
                                    update="@form"
                                    />
                        </p:commandButton>
                    </h:panelGroup>
                </f:facet>

            </p:card>
        </h:form>
    </cc:implementation>
</ui:composition>
