<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:crmArquivo="http://xmlns.jcp.org/jsf/composite/crmArquivo"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:p="http://primefaces.org/ui">

    <cc:interface>
        <cc:attribute name="pastas"
                      type="java.util.List" required="true"/>
        <cc:attribute name="pessoa"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa" required="true"/>
        <cc:attribute name="pstCliente"
                      default="true" required="true"/>
        <cc:attribute name="estiloTamanho" default="Fs50" />
        <cc:attribute name="tipoOrganizacao" default="OrganizadorContainerEsquerda" />
        <cc:attribute name="tamanhoContator" default="large" shortDescription="large x large ou em branco" />
    </cc:interface>

    <cc:implementation>

        <h:outputStylesheet name="pastas.css" library="crmArquivo" />

        <h:panelGroup styleClass="Container12 OrganizadorContainer" layout="block">
            <h:panelGroup styleClass="Container8 #{cc.attrs.tipoOrganizacao}" style="height: 100%;" layout="block">

                <c:forEach items="#{cc.attrs.pastas}" var="cat">

                    <crmArquivo:pasta pasta="#{cat}"
                                      link="#{cc.attrs.pstCliente ? infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_DocumentosPessoaMbGestao.documentosPessoaFrmListarArquivosPastaCliente, cc.attrs.pessoa, cat.categoria) : infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_DocumentosPessoaMbGestao.documentosPessoaFrmListarArquivosPastaEquipe, cc.attrs.pessoa, cat.categoria)}"
                                      />



                </c:forEach>

            </h:panelGroup>
        </h:panelGroup>

    </cc:implementation>
</ui:composition>
