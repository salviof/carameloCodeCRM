<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:crmArquivo="http://xmlns.jcp.org/jsf/composite/crmArquivo"
    xmlns:p="http://primefaces.org/ui">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="pasta"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.arquivos.arquivoAnexado.ComoPasta" required="true"/>
        <cc:attribute name="link"
                      type="java.lang.String"
                      default="#"
                      required="true"  />
        <cc:attribute name="pastaAberta"
                      type="java.lang.Boolean"
                      default="false"
                      />

    </cc:interface>
    <cc:implementation>
        <p:link href="#{cc.attrs.link}"
                >

            <h:panelGroup styleClass="OrganizadorContainer crcPasta"
                          style="max-width:80px; max-height:100px; position:relative; margin:30px;"
                          layout="block">

                <p:badge value="#{cc.attrs.pasta.quantidade}"
                         size="large" severity="warning" visible="#{cc.attrs.pasta.quantidade gt 0}">

                    <span class="crcPastaIcone Fs50">
                        <span class="fa #{cc.attrs.pastaAberta?'fa-folder-open':'fa-folder'} crcPastaIcone-base BlueTextButton"></span>
                        <span class="#{cc.attrs.pasta.icone} crcPastaIcone-interno"></span>
                    </span>
                    <ui:fragment rendered="#{cc.attrs.pasta.temSolicitacaoParaMim}">

                        <span class="fa fa-exclamation crcPastaAlerta"
                              title="Existe solicitação para você nesta pasta"></span>
                        <p:tooltip for="@parent:@parent" value="Existe solicitação para você nesta pasta" />
                    </ui:fragment>
                    <br/>
                </p:badge>

                <span class="FontAdamantiumBold Fs16">#{cc.attrs.pasta.nome}</span>

                <h:panelGroup style="position:absolute; left:-10px; top:-10px;"
                              styleClass="fa fa-unlock"
                              rendered="#{cc.attrs.pasta.compartilharComConvidados}" />

            </h:panelGroup>
        </p:link>


    </cc:implementation>
</ui:composition>
