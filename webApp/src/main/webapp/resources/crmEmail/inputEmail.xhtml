<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:CRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:SBForm="http://xmlns.jcp.org/jsf/composite/SBComp/composite/formulario"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:sb="http://superbitsframework/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="email"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.mail.EmailCrm" required="true"/>
        <cc:attribute name="autoSave" type="javax.el.MethodExpression"  required="true"
                      shortDescription="Médodo responsável por salvar o rascunho" />
        <cc:attribute name="corFundo" default="#fffffffc" />
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <!-- Quill vem do PrimeFaces (texteditor): importado aqui para existir mesmo sem outro p:textEditor na pagina -->

        <!-- A inicializacao do editor mora em qlEditorEmail.js: roda na carga da pagina e apos cada update ajax, sem script inline aqui -->


        <h:panelGroup layout="block" styleClass="crc-comp-inputEmail" >

            <p:remoteCommand actionListener="#{pgExecutarAtividade.emailsalvarRascunho()}"
                             name="executarAutosave" />

            <h:panelGroup layout="block"  styleClass="formularioEdicaoEmail" style="height: 800px;"  >

                <SBInput:input registro="#{cc.attrs.email.getCampoInstanciadoByNomeOuAnotacao('texto')}"
                               campoInstanciado="#{cc.attrs.email.getCampoInstanciadoByNomeOuAnotacao('texto')}"
                               idAtualizarOnChange="@this"
                               layout="#{layoutsComponenteSB.layoutCampo.resumido}"
                               />


            </h:panelGroup>
        </h:panelGroup>
    </cc:implementation>
</ui:composition>
