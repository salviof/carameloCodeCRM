<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="titulo" />
        <cc:attribute name="icone" default="fa-newspaper-o" />
        <cc:attribute name="codigoestilo"  default="1" />
        <cc:attribute name="container"  default="Container3" />
        <cc:attribute name="valor" />
        <cc:attribute name="url"  default="#"
                      />
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <!--        <h:outputStylesheet  name="botaoLateralMenu.css" library="css"  />-->

        <p:link href="#{cc.attrs.url}"
                style="text-decoration: none;"
                onclick="bloquearArea(this.parentElement.id)"
                >
                    <!--                <div class="ui-g card colorbox colorbox-#{cc.attrs.codigoestilo}">-->
            <div class="card-moderno card-estilo-#{cc.attrs.codigoestilo}" style="max-width: 600px;min-width: 420px">
                <div class="card-conteudo">

                    <h:panelGroup styleClass="card-icone card-estilo-#{cc.attrs.codigoestilo}" style="min-width: 90px;min-height: 90px;">
                        <i class="fa #{cc.attrs.icone} Fs50"  ></i>
                    </h:panelGroup>

                    <div class="card-info">

                        <span class="card-valor Fs30"   >#{cc.attrs.valor}</span>
                        <span class="card-titulo Fs24" style="margin-left: 3px;">#{cc.attrs.titulo}</span>
                    </div>
                </div>
            </div>
        </p:link>

    </cc:implementation>
</ui:composition>
