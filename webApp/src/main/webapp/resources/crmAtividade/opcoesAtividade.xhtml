<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:crmAtividade="http://xmlns.jcp.org/jsf/composite/crmAtividade"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"

    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="atividade"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.Atividade.AtividadeCRM" required="true"/>
        <!-- Acoes extras de desfecho (crmAtividade:botaoAcaoAtividade). Entram antes do Concluir,
             que precisa ser sempre o ultimo item. Para variantes do concluir (ex.: enviar e-mail
             e concluir) use a variante "conclusao" do botao, descrita em atividade.css. -->
        <cc:facet name="extra" required="false"/>
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet library="crmAtividade" name="atividade.css" />
        <!-- Comportamento do painel (cabecalho, Escape, clique fora, trava durante o ajax): bloco "Painel de acoes" do atividade.js -->
        <h:outputScript library="crmAtividade" name="atividade.js" />

        <!-- Bloco fixo no canto inferior direito: rail de 50px recolhido, desliza para a
             esquerda no hover/foco. Nao e overlay: nao ha backdrop nem trava de rolagem. -->
        <h:panelGroup id="opcoesEdicaoAtividade" layout="block" styleClass="crc-comp-opcoesAtividade" >

            <!-- Durante o ajax de uma acao o painel recebe a classe de carregando (trava os itens)
                 e o item clicado a sua (spinner no rail). Ver bloco "Painel de acoes" do atividade.js. -->
            <aside class="AcoesAtv" aria-label="Ações da atividade">
                <!-- 1. Cabecalho/indicador: alterna .aberto (caminho do toque) -->
                <button type="button" class="AcoesAtvCabecalho" aria-expanded="false">
                    <span class="AcoesAtvCabecalhoIcone" aria-hidden="true">
                        <i class="fa-solid fa-chevron-left AcoesAtvChevron"></i>
                    </span>
                    <span class="AcoesAtvCabecalhoTitulo">Ações da atividade</span>
                </button>

                <!-- 2. Gestao: acoes que mantem a atividade aberta -->
                <fieldset class="AcoesAtvGrupo AcoesAtvGrupo--gestao">
                    <legend class="AcoesAtvGrupoRotulo">Gestão da atividade</legend>
                    <div class="AcoesAtvLista">
                        <crmAtividade:opcoesAtividadeResumido
                            atividade="#{cc.attrs.atividade}"
                            />
                    </div>
                </fieldset>

                <!-- 3. Conclusao: desfechos. O Concluir fecha a pilha, no canto de baixo -->
                <fieldset class="AcoesAtvGrupo AcoesAtvGrupo--conclusao">
                    <legend class="AcoesAtvGrupoRotulo">Conclusão</legend>
                    <div class="AcoesAtvLista">
                        <crmAtividade:botaoAcaoAtividade
                            titulo="#{pgExecutarAtividade.acaoContinuarMaisTarde.nome}"
                            descricao="Continua pendente"
                            icone="fa-regular fa-clock"

                            rendered="#{!pgExecutarAtividade.vaiAgendar}"
                            atualizar="@form"
                            metodo="#{pgExecutarAtividade.salvarMaisTarde()}"
                            />

                        <cc:renderFacet name="extra"/>

                        <crmAtividade:botaoAcaoAtividade
                            titulo="#{cc.attrs.atividade.tipoAtividade.nomeFimAtividaed}"
                            descricao="Finaliza e registra a atividade"

                            icone="fa-solid fa-check"
                            styleClasses="botaoAcaoAtv--principal"
                            rendered="#{!pgExecutarAtividade.vaiAgendar and cc.attrs.atividade.permitidoConcluir}"
                            atualizar="@form"
                            metodo="#{pgExecutarAtividade.concluirAtividade()}"
                            />
                    </div>
                </fieldset>
            </aside>
        </h:panelGroup>
    </cc:implementation>
</ui:composition>
