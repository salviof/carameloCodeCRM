<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:CRMAtividade="http://xmlns.jcp.org/jsf/composite/crmAtividade"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:crmEmail="http://xmlns.jcp.org/jsf/composite/crmAtividade"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:f="http://xmlns.jcp.org/jsf/core">


    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="empresa"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa" required="true"/>



    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:panelGroup styleClass="Container12 OrganizadorContainerDireita" layout="block" >
            <h:panelGroup styleClass="Fright" layout="block" >
                <h:form>
                    <p:commandButton value="Alterar relacionamento" type="button" icon="pi pi-external-link"


                                     onclick="PF('gruposDeAcao').show()"/>
                </h:form>
            </h:panelGroup>
        </h:panelGroup>
        <p:dialog header="#{cc.attrs.empresa.relacionamento.nome}" widgetVar="gruposDeAcao"
                  minHeight="40" minWidth="600" showEffect="fade" modal="true" closeOnEscape="true"  >
            <h:form>
                <CRMAtividade:seletorAtividades
                    tamanho="M"
                    empresa="#{pgExecutarAtividade.prospecto}"
                    listaAtividades="#{cc.attrs.empresa.relacionamento.getCampoInstanciadoByNomeOuAnotacao('atividadesGrupoDeAtividades').valor}"
                    tipoBotoao="GRUPO"
                    />
            </h:form>
        </p:dialog>

    </cc:implementation>
</ui:composition>
