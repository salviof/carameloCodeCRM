<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:crmAtividade="http://xmlns.jcp.org/jsf/composite/crmAtividade"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:f="http://xmlns.jcp.org/jsf/core">


    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="empresa"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.prospecto.Pessoa" required="true"/>

        <cc:attribute name="tamanho" type="java.lang.String" required="false" default="M"
                      shortDescription="Tamanho do botao quadrado da atividade: P, M (padrao) ou G."/>

        <cc:attribute name= "listaAtividades" />
        <cc:attribute name="tipoBotoao" shortDescription="UP-DOW-ATUAL-GRUPO" default="ATUAL" />
    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet name="atividade.css" library="crmAtividade" />
        <h:panelGroup  styleClass="botaoAtvDisponivelPessoa semBorda Container12 OrganizadorContainer"  >
            <h:panelGroup layout="block" styleClass="Container12" >
                <h:panelGroup styleClass="SbBotoesDeEscolha" layout="block"  >
                    <f:passThroughAttribute name="marcador" value="inputFormulario" />
                    <p:blockUI
                        rendered="#{pgUtil.getNomeIdPFieldSetPai(component)!=null}"
                        block="#{pgUtil.getNomeIdPFieldSetPai(component)}"
                        widgetVar="#{pgUtil.getNomeIdPainelGroupInputSB(component)}#{pgUtil.getNomeIdPFieldSetPai(component)}"
                        >
                        <div style="
                             z-index: 10000;
                             position: absolute;
                             margin-top: 0px;
                             width: 200px;
                             border: none !important;     padding: 0 !important;
                             margin-left: 0px; "
                             class="OrganizadorContainer"
                             >
                            <p:graphicImage
                                name="images/preloader.gif" library="primefaces-adamantium"
                                />
                        </div>
                    </p:blockUI>
                    <h:panelGroup layout="block" styleClass="SbAtvQuadLista" rendered="#{not empty cc.attrs.listaAtividades and cc.attrs.listaAtividades.size()>0}" >
                        <ui:repeat value="#{cc.attrs.listaAtividades}" var="opc" varStatus="rec">
                            <crmAtividade:btAtividadeExecutiva empresa="#{cc.attrs.empresa}" tipoAtividade="#{opc}" tamanho="#{cc.attrs.tamanho}" rendered="#{cc.attrs.tipoBotoao eq 'ATUAL'}"  />
                            <crmAtividade:btAtividadeAgrupamento empresa="#{cc.attrs.empresa}" tipoAtividade="#{opc}" tamanho="#{cc.attrs.tamanho}" rendered="#{cc.attrs.tipoBotoao eq 'GRUPO'}"  />
                        </ui:repeat>
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGroup>
            <p:separator/>
        </h:panelGroup>
    </cc:implementation>
</ui:composition>
