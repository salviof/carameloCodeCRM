
<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:sb="http://superbitsframework/ui"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"

    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">



    <!-- INTERFACE -->
    <cc:interface
        shortDescription="Mostra a area de ocumpação de uma div, pontilhada, e informações sobre o modelo selecionado, e a àrea do modelo"
        >

        <cc:attribute
            type="com.super_bits.modulosSB.SBCore.modulos.view.modeloFormulario.ModeloPagina"
            name="modelo"
            required="true"
            shortDescription="Modelo da Pagina"
            />


    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <h:panelGroup styleClass="Container12 detalhesDoModelo" >
            #{cc.attrs.modelo}
        </h:panelGroup>

    </cc:implementation>
</ui:composition>
