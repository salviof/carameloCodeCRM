<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:cc="http://java.sun.com/jsf/composite"
                xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
                xmlns:SBBotao="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:CRM="http://xmlns.jcp.org/jsf/composite/crm"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="atividade"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.Atividade.AtividadeCRM"
                      required="true"/>


    </cc:interface>
    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <h:panelGroup layout="block" styleClass="atividadeContainer" style="display: flex; flex-direction: row;">

            <!-- ESQUERDA - BOTÃO -->
            <h:panelGroup layout="block" styleClass="atividadeBotao" style="margin-top: 18px;">

                <h:form>
                    <h:panelGroup layout="block" style="margin-left: 12px;" >
                        <CRM:botaoPersonalizado
                            metodo="#{servicosCRM.continuarAtividade(cc.attrs.atividade)}"
                            titulo="#{cc.attrs.atividade.tipoAtividade.nome}"
                            icone="#{cc.attrs.atividade.tipoAtividade.icone}" />
                    </h:panelGroup>
                </h:form>

            </h:panelGroup>


            <!-- DIREITA - RESUMO -->
            <h:panelGroup layout="block" styleClass="atividadeResumo">

                <h:panelGroup layout="block" styleClass="atividadeDescricao">
                    <p:outputLabel value="#{cc.attrs.atividade.anotacoes}" />
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="atividadeMeta">

                    <h:panelGroup layout="block" styleClass="atividadeLinhaMeta usuarioMeta">

                        <CRM:avatar somenteLeitura="true" usuario="#{cc.attrs.atividade.usuarioInsersao}" mostrarNome="true" />



                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="atividadeLinhaMeta">
                        <i class="fa fa-clock-o"></i>
                        <p:outputLabel value="#{pgUtil.gerarDataHoraTexto(cc.attrs.atividade.dataHoraInicioAtividade)}"/>
                    </h:panelGroup>

                    <h:panelGroup layout="block"
                                  styleClass="atividadeLinhaMeta"
                                  rendered="#{cc.attrs.atividade.dataHoraPrevisaoExecucao != null}">
                        <i class="fa fa-calendar"></i>
                        <p:outputLabel value="Agendado para: #{pgUtil.gerarDataHoraTexto(cc.attrs.atividade.dataHoraPrevisaoExecucao)}"/>
                    </h:panelGroup>

                </h:panelGroup>

            </h:panelGroup>

        </h:panelGroup>

    </cc:implementation>
</ui:composition>
