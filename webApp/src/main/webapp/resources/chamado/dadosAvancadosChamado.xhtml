<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:pe="http://primefaces.org/ui/extensions"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:SBAcao="http://xmlns.jcp.org/jsf/composite/SBComp/composite/paginaAtualDeEntidade"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="chamado"
                      type="br.org.carameloCode.erp.modulo.crm.entidadesJPA.chamado.ChamadoCliente" required="true"/>

    </cc:interface>

    <cc:implementation>

        <h:panelGroup layout="block" styleClass="Container12 ChamadoAvancadoDados">
            <h:panelGroup layout="block" styleClass="ChamadoAvancadoCard">

                <!-- Topo: logo/foto do representante legal + grau de satisfação -->
                <h:panelGroup layout="block" styleClass="ChamadoAvancadoTopo">

                    <h:panelGroup layout="block" styleClass="ChamadoAvancadoCliente">
                        <p:link styleClass="ChamadoAvancadoClienteLink"
                                href="#{infoWebApp.getUrlDaAcao(acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmOpcoesDoProspecto,cc.attrs.chamado.usuarioCliente.representanteLegal)}" >
                            <img class="ChamadoAvancadoClienteImagem"
                                 src="#{cc.attrs.chamado.usuarioCliente.representanteLegal.imgPequena}" />
                        </p:link>
                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="ChamadoAvancadoSatisfacao">
                        <i class="#{cc.attrs.chamado.usuarioCliente.satisfacao.icone} ChamadoAvancadoSatisfacaoIcone" />
                        <h:panelGroup layout="block" styleClass="ChamadoAvancadoSatisfacaoTexto">
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoSatisfacaoNome">
                                #{cc.attrs.chamado.usuarioCliente.satisfacao.nome}
                            </h:panelGroup>
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoSatisfacaoLegenda">
                                com nossos serviços
                            </h:panelGroup>
                        </h:panelGroup>
                    </h:panelGroup>

                </h:panelGroup>

                <!-- Dados de contato do cliente -->
                <h:form styleClass="ChamadoAvancadoForm">
                    <h:panelGroup layout="block" styleClass="ChamadoAvancadoLista">

                        <h:panelGroup layout="block" styleClass="ChamadoAvancadoItem">
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoRotulo">
                                <i class="fa-solid fa-user ChamadoAvancadoRotuloIcone" />
                                Contato
                            </h:panelGroup>
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoValor ChamadoAvancadoValorAcoes ChamadoAvancadoValorNome">
                                <!-- Mesma estrutura dos composites SBCRM (rótulo + botões
                                     dentro de um bloco), para o CSS tratar as três linhas igual -->
                                <h:panelGroup layout="block">
                                    <p:outputLabel value="#{cc.attrs.chamado.usuarioCliente.getCampoInstanciadoByNomeOuAnotacao('contatoClienteVinculado').valor.nome}" />
                                    <p:button icon="fa fa-copy"
                                              id="copiarContato"
                                              title="Copiar"
                                              onclick="return false;"
                                              href="#" >
                                        <pe:clipboard trigger="copiarContato" action="copy"
                                                      text="#{cc.attrs.chamado.usuarioCliente.getCampoInstanciadoByNomeOuAnotacao('contatoClienteVinculado').valor.nome}" />
                                    </p:button>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="ChamadoAvancadoItem">
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoRotulo">
                                <i class="fa-solid fa-phone ChamadoAvancadoRotuloIcone" />
                                Telefone
                            </h:panelGroup>
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoValor ChamadoAvancadoValorAcoes">
                                <SBCRM:telefoneAcoesAtendente
                                    telefone="#{cc.attrs.chamado.usuarioCliente.getCampoInstanciadoByNomeOuAnotacao('contatoClienteVinculado').valor.celular}"
                                    />
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="ChamadoAvancadoItem">
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoRotulo">
                                <i class="fa-solid fa-envelope ChamadoAvancadoRotuloIcone" />
                                E-mail
                            </h:panelGroup>
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoValor ChamadoAvancadoValorAcoes">
                                <SBCRM:emailAcoesAtendente
                                    email="#{cc.attrs.chamado.usuarioCliente.getCampoInstanciadoByNomeOuAnotacao('contatoClienteVinculado').valor.email}"
                                    contato='#{cc.attrs.chamado.usuarioCliente.contatoClienteVinculado}'
                                    />
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="ChamadoAvancadoItem"
                                      rendered="#{cc.attrs.chamado.atendenteResponsavel!=null}">
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoRotulo">
                                <i class="fa-solid fa-headset ChamadoAvancadoRotuloIcone" />
                                Resp.
                            </h:panelGroup>
                            <h:panelGroup layout="block" styleClass="ChamadoAvancadoValor">
                                #{cc.attrs.chamado.atendenteResponsavel.nome}
                            </h:panelGroup>
                        </h:panelGroup>

                    </h:panelGroup>
                </h:form>

                <!-- Ações do atendente sobre o chamado ainda não assumido -->
                <h:panelGroup layout="block" styleClass="ChamadoAvancadoAcoes"
                              rendered="#{!cc.attrs.chamado.chamadoEmEstadoAtendimento}">
                    <h:panelGroup layout="block" styleClass="ChamadoAvancadoAcoesTitulo">
                        Ações
                    </h:panelGroup>
                    <h:form styleClass="ChamadoAvancadoAcoesForm">
                        <SBAcao:botaoAcaoPersonalizada
                            acao="#{acoesAtendimentoCrm_MeusChamadosMbGestao.meusChamadosFrmChamadosDefinirAtendimento}"
                            />
                    </h:form>
                </h:panelGroup>

            </h:panelGroup>
        </h:panelGroup>
    </cc:implementation>
</ui:composition>
