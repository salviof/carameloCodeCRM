<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:crmAgenda="http://xmlns.jcp.org/jsf/composite/crmAgenda"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="areaAtualizacao" required="true"/>
        <cc:attribute name="agendaDiponibilidade"
                      type="br.org.carameloCode.erp.modulo.agenda.entidadesJPA.escopoPesquisa.AgendaDisponibilidade"
                      required="true"/>
        <cc:attribute name="vagasDisponiveis" default="false"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>


        <crmAgenda:dataDisponivel

            areaAtualizacao="painelHorariosDisponives"
            agendaDiponibilidade="#{servicoCrmReserva.agendaDisponibilidade}"


            />


        <h:panelGroup id="painelHorariosDisponives" layout="block">

            <crmAgenda:horariosDisponiveis
                horariosDisponiveis="#{servicoCrmReserva.agendaDisponibilidade.horariosDisponiveis}"

                rendered="#{pgReservasCliente.agendaDisponivel.horariosDisponiveis.size()>0}"
                />
        </h:panelGroup>


    </cc:implementation>
</ui:composition>
