<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:SBCRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:crmDashBoard="http://xmlns.jcp.org/jsf/composite/dashboard"
    xmlns:crm="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:crmCliente="http://xmlns.jcp.org/jsf/composite/crmCliente"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="#{layoutsPaginas.modeloGeral.xhtmlVinculado}"
    xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="divConteudo">
        <h:outputStylesheet  name="dashboard.css" library="dashboard" />
        <div id="fb-root"></div>
        <script async="true" defer="true" crossorigin="anonymous"
                src="#{pgDashboardCliente.scriptFacebook}"
                nonce="hGzP8iJf">
        </script>
        <h:panelGroup id="#{paginaAtual.infoPagina.idAreaExbicaoAcaoSelecionada}" styleClass="Container12OrganizadorContainer" style="" layout="block">

            <h:panelGroup styleClass="Container12 OrganizadorContainer " style="height: 500px" layout="block" >
                <h:panelGroup rendered="#{pgDashboardCliente.integracoes.size()>0}" layout="block" style="position: relative;" styleClass="Container12 OrganizadorContainer">
                    <c:forEach items="#{pgDashboardCliente.integracoes}" var="integracao" >
                        <SBCRM:integracaoCliente integracao="#{integracao}" tamanhoPixel="60" />
                    </c:forEach>
                </h:panelGroup>
                <h:panelGroup styleClass="logoClienteDashboard" layout="block" rendered="#{sessaoAtualSBWP.usuario.representanteLegal.temImagemPequenaAdicionada}" style="" >
                    <img class=""  src="#{sessaoAtualSBWP.usuario.representanteLegal.imgPequena}"
                         style="
                         min-height: 20px;
                         max-width: 100%;
                         max-height:  100px;
                         position: relative;
                         top: #{sessaoAtualSBWP.telaUsuario.umMobile?'0px;':'240px;'};
                         background-color: #FFFFFF;
                         " />
                </h:panelGroup>

                <div class="quebraBlocoComEspacoVertical2" ></div>
                <crmCliente:satisfacaoGrande />





                <div class="quebraBlocoComEspacoVertical2" ></div>
                <h:panelGroup layout="block" styleClass="Container12 cards-dashboard" style="margin-top: 100px;">
                    <h:panelGroup  layout="block" >
                        <crmDashBoard:dashBoardIconeTextoTituloLink
                            url="#{pgUtilAcoes.getUrlAcao(acoesClienteContato_ChamadoMbGestao.chamadoFrmListar)}"
                            icone="fa fa-life-ring"

                            titulo="#{pgDashboardCliente.usuarioLogado.getCampoInstanciadoByNomeOuAnotacao('metadados')
                                      .valorComoEntidadeSimples.getCampoInstanciadoByNomeOuAnotacao('chamadosAbertos').valor==0?'Novo Chamado':'Chamado'}#{pgDashboardCliente.usuarioLogado.getCampoInstanciadoByNomeOuAnotacao('metadados')
                                      .valorComoEntidadeSimples.getCampoInstanciadoByNomeOuAnotacao('chamadosAbertos').valor>1?'s':''}"
                            valor="#{pgDashboardCliente.usuarioLogado.getCampoInstanciadoByNomeOuAnotacao('metadados')
                                     .valorComoEntidadeSimples.getCampoInstanciadoByNomeOuAnotacao('chamadosAbertos').valor>0?'3':'1'}"
                            texto="#{pgDashboardCliente.usuarioLogado.getCampoInstanciadoByNomeOuAnotacao('metadados')
                                     .valorComoEntidadeSimples.getCampoInstanciadoByNomeOuAnotacao('chamadosAbertos').valor>0?pgDashboardCliente.usuarioLogado.metadados.chamadosAbertos:'Abrir Chamado'}"
                            codigoestilo="5" />
                    </h:panelGroup>
                    <h:panelGroup  layout="block" >
                        <crmDashBoard:dashBoardIconeTextoTituloLink
                            url="#{pgDashboardCliente.urlAgenda}"
                            codigoestilo="2"
                            icone="fa fa-ticket"
                            exibirBotaoNovoCasoZero="true"
                            valor="#{pgDashboardCliente.usuarioLogado.reservaAtivaMaisProxima==null?1:3}"
                            titulo="#{pgDashboardCliente.usuarioLogado.reservaAtivaMaisProxima==null?'':' '.toString().concat(pgDashboardCliente.usuarioLogado.reservaAtivaMaisProxima.status.nome)}"
                            texto="#{pgDashboardCliente.usuarioLogado.reservaAtivaMaisProxima==null?'Agende uma reunião':pgDashboardCliente.usuarioLogado.metadados.getCampoInstanciadoByNomeOuAnotacao('textoProximaReserva').valor}"
                            />
                    </h:panelGroup>


                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="Container12 cards-dashboard" >
                    <h:panelGroup  layout="block" >
                        <crmDashBoard:dashBoardIconeTextoTituloLink
                            url="#{infoWebApp.getUrlDaAcao(acoesClienteContato_DocumentosMbGestao.documentosMbGestao)}"
                            icone="fa fa-folder"
                            codigoestilo="3"
                            titulo="Ver pastas"
                            valor="2"
                            texto=""
                            />
                    </h:panelGroup>
                    <h:panelGroup layout="block" >
                        <crmDashBoard:dashBoardIconeTextoTituloLink
                            url="#{pgDashboardCliente.urlConversa}"
                            icone="fa fa-comments-o"
                            codigoestilo="4"
                            titulo="Chat de Atendimento"
                            valor="3"
                            texto=""
                            />
                    </h:panelGroup>

                </h:panelGroup>

            </h:panelGroup>



            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <h:form>
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" />
                </h:form>
            </p:confirmDialog>


        </h:panelGroup>
        [#{sessaoRocketChat.usuarioRC}]
    </ui:define>
</ui:composition>
