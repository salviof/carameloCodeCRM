<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:crmPessoa="http://xmlns.jcp.org/jsf/composite/crmPessoa"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:pt="http://java.sun.com/jsf/composite"
    template="modeloEdicaoProspecto.xhtml"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:crm="http://xmlns.jcp.org/jsf/composite/crm">
    <ui:define name="conteudo">

        <h:form>
            <p:remoteCommand name="ajusteTelainicial" update="atualizarAba" />
        </h:form>
        <h:outputStylesheet library="crmPessoa" name="opcoes_do_prospecto.css" />
        <h:outputScript library="crmPessoa" name="opcoes_do_prospecto.js" target="head" />

        <!-- ============================================================
             WRAPPER GERAL: escopo de CSS e ancora (position:relative)
             para a barra de acoes rapidas.
             ============================================================ -->
        <h:panelGroup layout="block" styleClass="DashboardVisaoGeralProspecto">

            <!-- ============================================================
                 BARRA DE ACOES RAPIDAS
                 Vive FORA do p:tabView de proposito: o facet "actions"
                 do p:tab so e renderizado enquanto a aba esta ativa.
                 Aqui ela persiste em qualquer aba.
                 Desktop: posicionada sobre a linha dos cabecalhos (CSS).
                 Mobile:  vira uma linha normal acima das abas.
                 ============================================================ -->

            <crmPessoa:acaoRapidaProspectoFull
                pessoa="#{pgProspecto.prospecto}"
                />




            <p:tabView id="dadosDaEmpresa"
                       cache="true"
                       widgetVar="abasLead"
                       dynamic="true"
                       >

                <p:ajax event="tabChange"
                        listener="#{pgProspecto.onTabChange}"
                        />
                <p:tab title=""   >

                    <f:facet name="title"   >
                        <h:panelGroup  styleClass="Fs24 fa fa-id-card-o" layout="block">
                            <p:outputLabel
                                styleClass="Fs24"
                                style="margin-left: 6px;vertical-align: central;" value=" Visão Geral" >
                            </p:outputLabel>

                            <p:tooltip for="@(.fa-id-card-o)" value="Dados fiscais, visão geral da interação com o lead " position="bottom"/>
                        </h:panelGroup>
                    </f:facet>

                    <ui:include src="prospecto_tabVisaoGeral.xhtml" />

                    <script>
                        setTimeout(ajusteTelainicial, 300);
                    </script>


                </p:tab>
                <p:tab >
                    <f:facet name="title"   >
                        <h:panelGroup  styleClass="Fs24 fa-regular fa-user" layout="block">
                            <p:outputLabel
                                styleClass="Fs24 FontNormal"
                                style="margin-left: 6px;vertical-align: central;" value=" Contatos" >
                            </p:outputLabel>

                            <p:tooltip for="@(.fa-user)" value="Contatos do Lead, abertura de chamados, e ações de contato" position="bottom"/>
                        </h:panelGroup>
                    </f:facet>

                    <ui:include src="prospecto_tabContatos.xhtml" />



                </p:tab>
                <p:tab title="Arquivo">
                    <f:facet name="title"   >

                        <h:panelGroup  styleClass="Fs24 fa fa-box-archive" layout="block">
                            <p:outputLabel
                                styleClass="Fs24 FontNormal"
                                style="margin-left: 6px;vertical-align: central;" value=" Arquivo" >

                            </p:outputLabel>

                            <p:tooltip for="@(.fa-box-archive)" value=" Arquivos, Histórico de atividades, chamados " position="bottom"/>
                        </h:panelGroup>


                    </f:facet>

                    <ui:include src="prospecto_tabArquivo.xhtml" />

                </p:tab>
                <p:tab>
                    <f:facet name="title">
                        <h:panelGroup  styleClass="Fs24 fa fa-play-circle-o" layout="block">
                            <p:outputLabel
                                styleClass="Fs24 "
                                style="margin-left: 6px;vertical-align: central;" value=" Atividades" >
                                <p:badge value="#{pgProspecto.somaTotalInteracoes}"
                                         style="    position: absolute; top:3px"
                                         rendered="#{pgProspecto.somaTotalInteracoes >0}"
                                         severity="success"/>
                            </p:outputLabel>

                            <p:tooltip for="@(.fa-play-circle-o)" value="Atividades em andamento (Chamados, solicitações, e Agenda)" position="bottom"/>
                        </h:panelGroup>
                    </f:facet>

                    <ui:include src="prospecto_tabAtividade.xhtml" />

                </p:tab>
            </p:tabView>

            <h:panelGroup id="atualizarAba">
                <script>
                    /* so a CHAMADA fica aqui, porque o indice vem de EL e
                     este painel e re-renderizado a cada tabChange;
                     a logica mora em opcoes_do_prospecto.js */
                    setTimeout(function () {
                        //    CarameloCode.prospecto.ajustarAba(#{pgProspecto.abaSelecionada});
                    }, 100);
                </script>
            </h:panelGroup>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <h:form>
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
                </h:form>
            </p:confirmDialog>

        </h:panelGroup>
        <!-- fim .DashboardVisaoGeralProspecto -->

    </ui:define>
</ui:composition>
