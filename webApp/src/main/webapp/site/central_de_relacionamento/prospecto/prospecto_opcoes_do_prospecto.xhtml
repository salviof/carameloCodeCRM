<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:crmPessoa="http://xmlns.jcp.org/jsf/composite/crmPessoa"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:pt="http://java.sun.com/jsf/composite"
    template="modeloEdicaoProspecto.xhtml"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:crm="http://xmlns.jcp.org/jsf/composite/crm">
    <ui:define name="conteudo">

        <h:form>
            <p:remoteCommand name="ajusteTelainicial" update="atualizarAba" />
        </h:form>


        <p:tabView id="dadosDaEmpresa"
                   cache="false"
                   widgetVar="abasLead"
                   dynamic="true"
                   >

            <p:ajax event="tabChange"
                    listener="#{pgProspecto.onTabChange}"
                    onstart="bloquearArea('#{pgUtil.gerarCaminhoCompletoID('dadosDaEmpresa')}')"
                    oncomplete="desbloquearArea('#{pgUtil.gerarCaminhoCompletoID('dadosDaEmpresa')}')"
                    update="atualizarAba"/>
            <p:tab title="" >

                <f:facet name="title"   >
                    <h:panelGroup  styleClass="Fs24 fa fa-id-card-o" layout="block">
                        <p:outputLabel
                            styleClass="Fs24"
                            style="margin-left: 6px;vertical-align: central;" value=" Visão Geral" >
                        </p:outputLabel>

                        <p:tooltip for="@(.fa-user)" value="Dados fiscais, visão geral da interação com o lead " position="bottom"/>
                    </h:panelGroup>
                </f:facet>

                <script>
                    setTimeout(ajusteTelainicial(), 300);
                </script>


                <h:panelGroup styleClass="container-cards-cliente">
                    <p:card styleClass="card-cliente" >

                        <crmPessoa:resumoPessoa pessoa="#{pgProspecto.prospecto}" />

                        <div class="card-lado-direito">
                            <crmPessoa:tagsVisaoGrande pessoa="#{pgProspecto.prospecto}"/>
                            <h:panelGroup
                                rendered="#{pgProspecto.prospecto.getCampoInstanciadoByNomeOuAnotacao('integracoesLink').valor.size()>0}"
                                style="position: relative;margin-bottom: 18px;"
                                styleClass="Container12 OrganizadorContainer">
                                <c:forEach
                                    items="#{pgProspecto.prospecto.getCampoInstanciadoByNomeOuAnotacao('integracoesLink').valor}"
                                    var="integracao">
                                    <crm:integracao integracao="#{integracao}" tamanhoPixel="25"
                                                    rendered="#{integracao.nome ne 'CRM'}"/>
                                </c:forEach>
                            </h:panelGroup>
                        </div>
                    </p:card>
                    <p:card styleClass="card-cliente">


                        <h:panelGroup styleClass="" id="reponsaveis" layout="block">
                            <crmPessoa:resumoEquipeChat
                                pessoa="#{pgProspecto.prospecto}"/>
                        </h:panelGroup>

                    </p:card>
                </h:panelGroup>

                <crmPessoa:dashboardPosAtendimento
                    pessoa="#{pgProspecto.prospecto}"
                    rendered="#{pgProspecto.prospecto.meta.cliente}"
                    />
            </p:tab>
            <p:tab >
                <f:facet name="title"   >
                    <h:panelGroup  styleClass="Fs24 fa-regular fa-user" layout="block">
                        <p:outputLabel
                            styleClass="Fs24 FontNormal"
                            style="margin-left: 6px;vertical-align: central;" value=" Contatos" >

                        </p:outputLabel>

                        <p:tooltip for="@(.fa-user)" value="Contatos do Lead, abertura de chamados, e ações de contato" position="bottom"/>
                    </h:panelGroup>
                </f:facet>


                <h:panelGroup styleClass="container-cards-cliente" id="contatosDoLead">
                    <p:card styleClass="card-cliente">

                        <h:panelGroup styleClass="listagem-container-content">
                            <h:panelGroup styleClass="botoes-container Fright">
                                <h:panelGroup styleClass="badge-wrapper">
                                    <p:badge
                                        value="#{pgProspecto.entidadeSelecionada.getCampoInstanciadoByNomeOuAnotacao('quantidadeContatos').valor}"
                                        severity="info">

                                        <h:form>
                                            <p:commandButton
                                                actionListener="#{servicosCRM.exibirModalProspecto(pgProspecto.entidadeSelecionada,acoesAtendimentoCrm_ModalCrmMbProspectos.modalCrmFrmContatos)}"
                                                value="Editar Contatos"
                                                icon="#{acoesAtendimentoCrm_ModalCrmMbProspectos.modalCrmFrmContatos.icone}">
                                                <p:ajax event="click" listener="#{pgProspecto.onModalProspectoOpen}"/>
                                                <p:ajax event="dialogReturn"
                                                        listener="#{pgProspecto.onModalProspectoClose}"
                                                        onstart="bloquearArea('#{pgUtil.gerarCaminhoCompletoID('contatosDoLead')}')"
                                                        oncomplete="desbloquearArea('#{pgUtil.gerarCaminhoCompletoID('contatosDoLead')}')"
                                                        update="#{pgUtil.gerarCaminhoCompletoID('contatosDoLead')}"/>
                                            </p:commandButton>
                                        </h:form>

                                    </p:badge>
                                </h:panelGroup>
                                <h:form>

                                    <p:commandButton
                                        action="#{pgProspecto.executarAcao(pgProspecto.entidadeSelecionada)}"
                                        value="Chat, atendimento ao Cliente"
                                        style="width: 300px;"
                                        icon="#{acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmChatCliente.icone}"
                                        >


                                        <f:setPropertyActionListener target="#{pgProspecto.acaoSelecionada}"
                                                                     value="#{acoesAtendimentoCrm_ProspectoMbGerenciar.prospectoFrmChatCliente}"/>
                                    </p:commandButton>

                                </h:form>
                            </h:panelGroup>


                            <crmPessoa:menuPessoaAcoesDeContatoDisponiveis

                                pessoa="#{pgProspecto.entidadeSelecionada}"
                                rendered="#{pgProspecto.entidadeSelecionada.contatosProspecto.size()!=0}"
                                />
                        </h:panelGroup>
                    </p:card>
                </h:panelGroup>
            </p:tab>
            <p:tab title="Arquivo">
                <f:facet name="title"   >

                    <h:panelGroup  styleClass="Fs24 fa fa-box-archive" layout="block">
                        <p:outputLabel
                            styleClass="Fs24 FontNormal"
                            style="margin-left: 6px;vertical-align: central;" value=" Arquivo" >

                        </p:outputLabel>

                        <p:tooltip for="@(.fa-archive)" value=" Arquivos, Histórico de atividades, chamados " position="bottom"/>
                    </h:panelGroup>


                </f:facet>
                <crmPessoa:dashboardTrabalhoRealizado
                    pessoa="#{pgProspecto.prospecto}"
                    />
            </p:tab>
            <p:tab>
                <f:facet name="title">

                    <h:panelGroup  styleClass="Fs24 fa fa-play-circle-o" layout="block">
                        <p:outputLabel
                            styleClass="Fs24 "
                            style="margin-left: 6px;vertical-align: central;" value=" Atividades" >
                            <p:badge value="#{pgProspecto.somaTotalInteracoes}"
                                     style="    position: absolute; top:3px"
                                     rendered="#{pgProspecto.somaTotalInteracoes >0}"
                                     severity="success"/>
                        </p:outputLabel>

                        <p:tooltip for="@(.fa-play-circle-o)" value="Atividades em andamento (Chamados, solicitações, e Agenda)" position="bottom"/>
                        <h:panelGroup rendered="#{pgProspecto.somaTotalInteracoes != null and pgProspecto.somaTotalInteracoes == 0}">

                        </h:panelGroup>
                    </h:panelGroup>



                </f:facet>

                <crmPessoa:dashboardInteracao pessoa="#{pgProspecto.prospecto}"/>
            </p:tab>
        </p:tabView>

        <h:panelGroup id="atualizarAba">
            <script>




                function ajustarAba() {
                    var widget = PF('abasLead');
                    if (widget) {  // verifica se está pronto
                        var indiceCorreto = #{pgProspecto.abaSelecionada}; // valor do bean (EL vira número)
                        var atual = widget.getActiveIndex();
                        console.log('Widget pronto! Atual: ' + atual + ' | Desejado: ' + indiceCorreto);
                        if (atual !== indiceCorreto) {
                            console.log('Corrigindo aba para ' + indiceCorreto);
                            widget.select(indiceCorreto);
                        } else {
                            console.log('Aba já está correta');
                        }
                    }
                }

                setTimeout(ajustarAba, 100);

            </script>
        </h:panelGroup>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
            <h:form>
                <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
            </h:form>
        </p:confirmDialog>


    </ui:define>
</ui:composition>
