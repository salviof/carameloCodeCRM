<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:crmContato="http://xmlns.jcp.org/jsf/composite/crmContato"
    xmlns:SBBotaoDeAcao="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="#{layoutsPaginas.conteudoEmBranco.xhtmlVinculado}"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="conteudo">



        <h:form id="whatsappForm">
            <h:panelGroup layout="block" styleClass="OrganizadorContainer" >
                <h:panelGroup layout="block" styleClass="Container6" >
                    <crmContato:envioMsgWtsapp contato="#{pgMeusContatos.entidadeSelecionada}" mensagem="#{pgMeusContatos.mensagemWhatsapp}" />
                </h:panelGroup>
                <crmContato:historicoMsgWtsapp contato="#{pgMeusContatos.entidadeSelecionada}"/>
            </h:panelGroup>

            <!-- LOADING OVERLAY -->
            <p:ajaxStatus onstart="PF('loadingDialog').show()" onsuccess="PF('loadingDialog').hide()" />
            <p:dialog widgetVar="loadingDialog" modal="true" draggable="false" closable="false" showHeader="false">
                <div class="loading-overlay">
                    <div class="spinner"></div>
                </div>
            </p:dialog>

        </h:form>



    </ui:define>
</ui:composition>
