<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"

    xmlns:CRM="http://xmlns.jcp.org/jsf/composite/crm"
    xmlns:p="http://primefaces.org/ui"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:SBContato="http://xmlns.jcp.org/jsf/composite/crmContato"
    xmlns:SBForm="http://xmlns.jcp.org/jsf/composite/SBComp/composite/formulario"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:form>
        <h:outputStylesheet name="modalContato.css" library="crmContato"/>
        <p:focus for="@form"/>

        <h:panelGroup layout="block" styleClass="crc-comp-modalContatos">

            <!-- Cabeçalho: título, total de contatos e ação de novo contato -->
            <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-cabecalho">
                <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-titulo">
                    <h:panelGroup styleClass="fa-solid fa-address-book crc-comp-modalContatos-tituloIcone"/>
                    <h:outputText value="Contatos"/>
                    <h:outputText styleClass="crc-comp-modalContatos-contador"
                                  value="#{pgModalProspecto.prospectoSelecionado.contatosProspecto.size()}"/>
                </h:panelGroup>

                <p:commandButton
                    icon="#{acoesAtendimentoCrm_ModalCrmMbProspectos.modalCrmFrmContatoNovo.icone}"
                    value="Novo contato"
                    actionListener="#{pgModalProspecto.novoContatoFormulario()}"
                    update="@form"
                    styleClass="botaoVerde"
                    />
            </h:panelGroup>

            <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-corpo">

                <!-- Lista de contatos do prospecto -->
                <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-lista">
                    <p:dataTable id="products" var="contato" styleClass="TabelaModalContatos"
                                 value="#{pgModalProspecto.prospectoSelecionado.contatosProspecto}"
                                 rowKey="#{contato.id}" paginatorPosition="bottom"
                                 selection="#{pgModalProspecto.contatoSelecionado}" selectionMode="single"
                                 rows="#{sessaoAtualSBWP.telaUsuario.umMobile?1:5}" paginator="true"
                                 paginatorAlwaysVisible="false"
                                 emptyMessage="Nenhum contato cadastrado">
                        <p:column headerText="#" styleClass="crc-comp-modalContatos-colunaId">
                            <h:outputText value="#{contato.id}"/>
                        </p:column>

                        <p:column headerText="Clique em um contato para editar" styleClass="crc-comp-modalContatos-colunaNome">
                            <h:outputText value="#{contato.nome}"/>
                            <h:panelGroup styleClass="fa-solid fa-star crc-comp-modalContatos-estrela" 
                                          rendered="#{contato eq pgModalProspecto.prospectoSelecionado.contatoPrincipal}"/>
                        </p:column>

                        <p:ajax event="rowSelect" update="@form"/>
                    </p:dataTable>
                </h:panelGroup>

                <!-- Edição do contato selecionado -->
                <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-editor">

                    <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-vazio"
                                  rendered="#{pgModalProspecto.contatoSelecionado==null}">
                        <h:panelGroup styleClass="fa-regular fa-hand-pointer crc-comp-modalContatos-vazioIcone"/>
                        <h:outputText value="Selecione um contato na lista ou clique em Novo contato"/>
                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-cartao"
                                  rendered="#{pgModalProspecto.contatoSelecionado!=null}">

                        <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-cartaoCabecalho">
                            <h:panelGroup styleClass="fa-solid fa-user-pen"/>
                            <h:outputText styleClass="crc-comp-modalContatos-cartaoTitulo"
                                          value="Editando #{pgModalProspecto.contatoSelecionado.nome}"/>
                            <h:panelGroup styleClass="crc-comp-modalContatos-selo"
                                          rendered="#{pgModalProspecto.contatoSelecionado eq pgModalProspecto.prospectoSelecionado.contatoPrincipal}">
                                <h:panelGroup styleClass="fa-solid fa-star"/>
                                <h:outputText value="Principal"/>
                            </h:panelGroup>
                        </h:panelGroup>

                        <p:fragment>
                            <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-campos">
                                <SBInput:input
                                    registro="#{pgModalProspecto.contatoSelecionado.getCampoInstanciadoByNomeOuAnotacao('nome')}"
                                    layout="#{layoutsComponenteSB.layoutCampo.resumido}"
                                    idAtualizarOnChange="@this"
                                    />
                                <SBInput:input
                                    idAtualizarOnChange="@this"
                                    registro="#{pgModalProspecto.contatoSelecionado.getCampoInstanciadoByNomeOuAnotacao('email')}"
                                    layout="#{layoutsComponenteSB.layoutCampo.resumido}"
                                    />
                                <SBInput:input
                                    idAtualizarOnChange="@this"
                                    registro="#{pgModalProspecto.contatoSelecionado.getCampoInstanciadoByNomeOuAnotacao('celular')}"
                                    layout="#{layoutsComponenteSB.layoutCampo.resumido}"
                                    />
                            </h:panelGroup>

                            <!-- Ações: excluir à esquerda, salvar à direita -->
                            <h:panelGroup layout="block" styleClass="crc-comp-modalContatos-acoes">
                                <p:commandButton
                                    value="Excluir"
                                    icon="fa-solid fa-trash"
                                    actionListener="#{pgModalProspecto.excluirContato()}"
                                    update="@form"
                                    styleClass="botaoVermelho"
                                    >
                                    <p:confirm header="Confirma a exclusão?" message="Confirma a exclusão do contato #{pgModalProspecto.contatoSelecionado.nome}?" icon="pi pi-info-circle"/>
                                </p:commandButton>

                                <SBAcaoNav:botaoDeAcao metodo="#{pgModalProspecto.salvarAlteracoes()}"
                                                       acao="#{pgModalProspecto.acaoSalvarAlteracoes}"
                                                       label="Salvar contato"
                                                       classeEstilo="botaoVerde"
                                                       update="@form"
                                                       tipoVisualizacao="#{layoutsComponenteSB.layoutBotoes.iconeENome}"
                                                       />
                            </h:panelGroup>
                        </p:fragment>
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGroup>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="100%">
                <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>

            <p:fragment>
                <p:commandButton update="@form" value="Atualizar" rendered="#{infoWebApp.emModoDesenvolvimentoHomologacao}"
                                 styleClass="ui-button-flat crc-comp-modalContatos-atualizar"/>
            </p:fragment>
        </h:panelGroup>
    </h:form>

</ui:composition>
