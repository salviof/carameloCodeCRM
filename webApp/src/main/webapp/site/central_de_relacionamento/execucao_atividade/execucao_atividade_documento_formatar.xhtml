<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:CRMAtividade="http://xmlns.jcp.org/jsf/composite/crmAtividade"
    xmlns:CRMEmail="http://xmlns.jcp.org/jsf/composite/crmEmail"
    template="#{layoutsPaginas.conteudoEmBranco.xhtmlVinculado}"
    xmlns:pe="http://primefaces.org/ui/extensions"
    xmlns:p="http://primefaces.org/ui"
    xmlns:SBInput="http://xmlns.jcp.org/jsf/composite/SBComp/composite/input"
    xmlns:SBComp="http://xmlns.jcp.org/jsf/composite/SBComp"
    xmlns:SBNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
    xmlns:CRM="http://xmlns.jcp.org/jsf/composite/crm"
    >
    <ui:define name="conteudo">


        <CRMAtividade:cabecalhoAtividade  atividade="#{pgExecutarAtividade.atividade}">
            <f:facet name="opcoesCabecalhoAtividade">

                <p:fieldset legend="Arquivo Gerado" toggleable="true" collapsed="false" >
                    <h:form>
                        <c:forEach items="#{pgExecutarAtividade.atividade.documentosGerados}" var="doc">
                            <div class="Container10 Responsive100">
                                <SBInput:input registro="#{doc.getCampoByNomeOuAnotacao('arquivo')}"
                                               layout="#{layoutsComponenteSB.layoutCampo.esquerda}"
                                               desabilitarEdicao="true"
                                               />
                            </div>
                        </c:forEach>
                    </h:form>
                </p:fieldset>


            </f:facet>
        </CRMAtividade:cabecalhoAtividade>



        <h:panelGroup styleClass="Container12" layout="block">


            <h:panelGroup layout="block" styleClass="Container12" >
                <p:fieldset styleClass="Container12" style="height: 255px;"   >
                    <h:form>
                        <CRMAtividade:opcoesAtividade
                            atividade="#{pgExecutarAtividade.atividade}" >

                        </CRMAtividade:opcoesAtividade>
                        <CRM:opcoesAtividadeExtra atividade="#{pgExecutarAtividade.atividade}" rendered="false">
                            <f:facet name="extra">

                                <h:panelGroup  styleClass="Container6" rendered="#{!(pgExecutarAtividade.atividade.emailVinculado.foiEnviado)}">
                                    <h:panelGroup styleClass="btnSeletor-small btnSeletor-Bkg w3-border w3-btn"
                                                  rendered="" >

                                        <p:commandLink actionListener="#{pgExecutarAtividade.emailEnviar()}"


                                                       update="@this"
                                                       onstart="PF('blockDisparo').show();"
                                                       oncomplete="PF('blockDisparo').hide();"
                                                       disabled="#{pgExecutarAtividade.vaiAgendar}"
                                                       >

                                            <div class=" TexAlCenter " style="color: orange!important">
                                                <i class="#{acoesAtendimentoCrm_EnvioDocumentoMb.envioDocumentoCtrEnviarEmail.icone} Fs20 DispBlock MarBot20"></i>
                                                <span class="FontAdamantiumBold Fs14 DispBlock">#{acoesAtendimentoCrm_EnvioDocumentoMb.envioDocumentoCtrEnviarEmail.nomeAcao} com Relatório</span>
                                            </div>
                                        </p:commandLink>

                                    </h:panelGroup>







                                </h:panelGroup>
                            </f:facet>
                        </CRM:opcoesAtividadeExtra>
                    </h:form>

                    <h:outputText value="#{cc.attrs.atividade.listaBloqueios}" rendered="#{!cc.attrs.atividade.getCampoInstanciadoByNomeOuAnotacao('permitidoConcluir').valor
                                           and infoWebApp.emModoDesenvolvimentoHomologacao}" />
                </p:fieldset>
            </h:panelGroup>
        </h:panelGroup>





    </ui:define>
</ui:composition>
